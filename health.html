<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SafeBuy NG Health Check</title>
<style>
:root{--green:#087f5b;--ink:#172b24;--muted:#718078;--line:#e6ece8;--bg:#f7f9f7;--red:#8a1f1f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.wrap{width:min(760px,100% - 28px);margin:0 auto;padding:18px 0 60px}
h1{margin:0 0 4px;font-size:24px}
h2{margin:22px 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:14px}
.row b{display:block}
.ic{flex:0 0 22px;font-size:18px;line-height:1.3}
.fix{display:block;margin-top:2px;color:var(--red);font-size:13px}
.ok .fix{display:none}
button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;background:var(--green);color:#fff;margin:6px 8px 6px 0}
button.o{background:#fff;color:var(--ink);border:1px solid var(--line)}
#sum{padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:16px;font-weight:700}
</style>
</head>
<body>
<main class="wrap">
  <h1>SafeBuy NG Health Check</h1>
  <p class="muted">This page checks that every file and database function your site needs is in place. It only reads. It changes nothing.</p>
  <div id="sum">Checking… (about 15 seconds)</div>
  <button id="again" type="button">Check again</button><button id="copy" class="o" type="button" disabled>Copy report (wait…)</button>
  <div id="out"></div>
</main>
<script src="./supabase-config.js"></script>
<script>
(function () {
  "use strict";
  var out = document.getElementById("out"), sum = document.getElementById("sum");
  var cfg = window.SAFEbuySupabaseConfig || {};
  var base = String(cfg.url || "").replace(/\/+$/, ""), key = cfg.publishableKey || "";
  var report = [], counts = { ok: 0, bad: 0, warn: 0 };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function section(t) { out.insertAdjacentHTML("beforeend", "<h2>" + esc(t) + "</h2>"); report.push("\n== " + t); }
  function row(state, title, detail, fix) {
    counts[state]++;
    var ic = state === "ok" ? "✅" : state === "bad" ? "❌" : "⚠️";
    out.insertAdjacentHTML("beforeend", '<div class="row ' + state + '"><span class="ic">' + ic + "</span><div><b>" + esc(title) + "</b>" +
      (detail ? '<span class="muted">' + esc(detail) + "</span>" : "") + (fix && state !== "ok" ? '<span class="fix">' + esc(fix) + "</span>" : "") + "</div></div>");
    report.push((state === "ok" ? "OK   " : state === "bad" ? "FAIL " : "WARN ") + title + (detail ? " - " + detail : "") + (fix && state !== "ok" ? " | FIX: " + fix : ""));
  }
  function get(path) {
    return fetch(path + (path.indexOf("?") < 0 ? "?" : "&") + "hc=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text().then(function (t) { return { ok: true, text: t }; }) : { ok: false, status: r.status }; })
      .catch(function () { return { ok: false, status: 0 }; });
  }
  // [file, strings that must be inside it (proves it is the latest version), what to do]
  var FILES = [
    ["./index.html", ["sc-notice-text", "about.html", "site_content", "data-door", "__sbWhenReady"], "Upload the latest index.html to the main folder."],
    ["./vendor/supabase-2.45.4.js", ["createClient"], "Upload the Supabase library copy into a folder named vendor (see the steps I gave you). Without it the site still works but loads slower."],
    ["./reset.html", ["serviceWorker"], "Upload reset.html to the main folder."],
    ["./sw.js", ["safebuy-v4", "no-cache"], "Upload the new sw.js to the main folder (replaces the old one)."],
    ["./pwa-install.js", ["controllerchange", "signedIn"], "Upload the new pwa-install.js to the main folder."],
    ["./delivery.js", ["dp-pcode", "vh-picker", "dp-live"], "Upload the latest rider file, named delivery.js (replace the old one)."],
    ["./delivery-orders.js", ["rate_delivery", "order_tracking", "seller_request_delivery"], "Upload the latest delivery-orders.js."],
    ["./orders.js", [], "orders.js is missing. It is part of your original site."],
    ["./admin.html", ["partnerSummary", "data-adel", "admin-plus.js"], "Upload the latest admin.html."],
    ["./admin-ops.js", ["ops-panel", "admin_set_switches", "admin_audit_list", "admin_broadcast", "admin_decide_promo"], "Upload admin-ops.js next to admin.html."],
    ["./guard.js", ["log_client_error", "unhandledrejection"], "Upload guard.js to the main folder."],
    ["./growth.js", ["home_sections", "sb-recent"], "Upload growth.js to the main folder."],
    ["./seller-growth.js", ["seller_growth", "growth-host"], "Upload seller-growth.js to the main folder."],
    ["./seller-plan.js", ["plan-card", "seller_subscription"], "Upload seller-plan.js to the main folder."],
    ["./seller-hub.js", ["seller_request_promo", "my_referral", "claim_referral"], "Upload seller-hub.js to the main folder."],
    ["./impressions.js", ["track_impressions"], "Upload impressions.js to the main folder."],
    ["./switches.js", ["sb-maint", "signups_open"], "Upload switches.js to the main folder."],
    ["./admin-plus.js", ["openLaunch", "refund_text", "openBackup"], "Upload the latest admin-plus.js to the same folder as admin.html."],
    ["./privacy.html", [], "Upload privacy.html."], ["./terms.html", [], "Upload terms.html."],
    ["./about.html", [], "Upload about.html."], ["./refund.html", [], "Upload refund.html."],
    ["./rider.webp", [], "Upload rider.webp to the main folder."],
    ["./seller/index.html", ["role-open", "role-gate", "Seller sign in", "__sbWhenReady"], "Upload seller/index.html (inside the seller folder)."],
    ["./seller/manifest.json", ["SafeBuy Seller"], "Upload seller/manifest.json."], ["./seller/sw.js", ["seller-v1"], "Upload seller/sw.js."],
    ["./rider/index.html", ["rd-go", "delivery.js", "__sbWhenReady", "showInstall(false, true)", "rd-call"], "Upload the new rider/index.html (inside the rider folder). It is the delivery-only Rider app."],
    ["./rider/manifest.json", ["SafeBuy Rider"], "Upload rider/manifest.json."], ["./rider/sw.js", ["rider-v1"], "Upload rider/sw.js."]
  ];
  function checkFiles() {
    section("1. Website files");
    return Promise.all(FILES.map(function (f) { return get(f[0]); })).then(function (rs) {
      rs.forEach(function (r, i) {
        var f = FILES[i], name = f[0].slice(2);
        if (!r.ok) { row("bad", name, "not found (error " + r.status + ")", f[2]); return; }
        var missing = f[1].filter(function (s) { return r.text.indexOf(s) < 0; });
        if (missing.length) row("bad", name, "found, but it is an OLD version", f[2]);
        else row("ok", name, "latest version");
      });
      // every script the pages load must exist, otherwise buttons silently stop working
      return Promise.all([get("./index.html"), get("./seller/index.html"), get("./rider/index.html")]);
    }).then(function (pages) {
      section("2. Scripts each page loads");
      var seen = {};
      pages.forEach(function (p, i) {
        if (!p.ok) return;
        var prefix = ["./", "./seller/", "./rider/"][i], m, re = /<script[^>]+src="(\.{1,2}\/[^"?#]+)/g, list = [];
        while ((m = re.exec(p.text))) list.push(m[1]);
        list.forEach(function (src) {
          var url = new URL(src, location.origin + location.pathname.replace(/[^/]*$/, "") + prefix.slice(2)).pathname;
          seen[url] = seen[url] || [];
          seen[url].push(["shop", "seller app", "rider app"][i]);
        });
      });
      var urls = Object.keys(seen);
      return Promise.all(urls.map(function (u) { return fetch(u + "?hc=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok; }, function () { return false; }); })).then(function (oks) {
        oks.forEach(function (ok, i) {
          var short = urls[i].replace(/^.*\/safebuy\.com\//, "").replace(/^\//, "");
          if (ok) row("ok", short, "loads in: " + seen[urls[i]].filter(function (v, k, a) { return a.indexOf(v) === k; }).join(", "));
          else row("bad", short, "MISSING. Pages use it, so some buttons will not work", "Upload " + short.split("/").pop() + " to the folder it belongs in.");
        });
      });
    });
  }
  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ apikey: key, Authorization: "Bearer " + key, "Content-Type": "application/json" }, opt.headers || {});
    var ctl = typeof AbortController === "function" ? new AbortController() : null;
    var tm = setTimeout(function () { if (ctl) ctl.abort(); }, 9000);
    if (ctl) opt.signal = ctl.signal;
    return fetch(base + path, opt).then(function (r) { clearTimeout(tm); return r.text().then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) {} return { status: r.status, json: j, text: t }; }); })
      .catch(function () { clearTimeout(tm); return { status: 0, json: null, text: "" }; });
  }
  var TABLES = [
    ["seller_products_public", "Products shown to shoppers", ""], ["site_content", "Admin-edited site text", "Run site_content.sql in Supabase."],
    ["user_alerts", "In-app updates", "Run delivery_automation_paste.sql in Supabase."], ["order_events", "Order progress list", "Run connect_roles.sql in Supabase."],
    ["delivery_ratings", "Rider ratings", "Run connect_roles.sql in Supabase."], ["admin_deleted_log", "Deleted-records log", "Run admin_delete.sql in Supabase."],
    ["delivery_supported_areas", "Delivery areas", ""], ["delivery_partners", "Delivery partners", ""], ["delivery_jobs", "Delivery jobs", ""], ["delivery_payouts", "Payouts", ""],
    ["marketplace_orders", "Orders", "", "private"], ["seller_applications", "Seller applications", "", "private"], ["reports", "Product reports", "", "private"], ["admin_kv", "Admin notes", "", "private"], ["admin_audit", "Admin log", "", "private"], ["client_errors", "Crash log", "", "private"], ["subscription_payments", "Subscription payments", "", "private"], ["rate_hits", "Abuse counters", "", "private"]
  ];
  var RPCS = [
    ["list_delivery_coverage", {}, "Delivery areas list", "Run: grant execute on function public.list_delivery_coverage() to anon, authenticated;"],
    ["order_tracking", { p_order: "00000000-0000-0000-0000-000000000000" }, "Order progress and contacts", "Run connect_roles.sql in Supabase."],
    ["rate_delivery", { p_order: "00000000-0000-0000-0000-000000000000", p_stars: 5 }, "Rider ratings", "Run connect_roles.sql in Supabase."],
    ["alerts_mark_read", {}, "In-app updates", "Run delivery_automation_paste.sql in Supabase."],
    ["partner_update_job", { p_job: "00000000-0000-0000-0000-000000000000", p_status: "x" }, "Rider pickup and delivery", "Run connect_roles.sql in Supabase."],
    ["admin_delete", { p_kind: "x", p_id: "x" }, "Admin delete", "Run admin_delete.sql in Supabase."],
    ["home_sections", {}, "Home sections and growth counters", "Run growth.sql in Supabase."],
    ["seller_request_delivery", { p_order: "00000000-0000-0000-0000-000000000000", p_state: "x", p_city: "x", p_address: "x", p_phone: "x" }, "Seller requests delivery for buyer", "Run seller_delivery.sql in Supabase."],
    ["shops_without_badge", {}, "Seller plans", "Run seller_plans.sql in Supabase."],
    ["my_promos", {}, "Seller promote, boost and invite tools", "Run growth2.sql in Supabase."],
    ["admin_orders", {}, "Admin Orders and Users", "Run admin_control.sql in Supabase."],
    ["admin_audit_list", {}, "Admin action log", "Run admin_extra.sql in Supabase (last)."],
    ["admin_security_audit", {}, "Admin Security check and Errors", "Run hardening.sql in Supabase (last)."],
    ["admin_live", {}, "Admin Control tab", "Run admin_ops.sql in Supabase."],
    ["partner_set_vehicle", { p_type: "x" }, "Rider vehicle types", "Run vehicles.sql in Supabase."],
    ["admin_backup_tables", {}, "Admin backup", "Run backup_and_speed.sql in Supabase."]
  ];
  function checkDb() {
    section("3. Database tables");
    if (!base || !key) { row("bad", "supabase-config.js", "Supabase settings did not load", "Upload supabase-config.js to the main folder."); return Promise.resolve(); }
    return Promise.all(TABLES.map(function (t) { return api("/rest/v1/" + t[0] + "?select=*&limit=1"); })).then(function (rs) {
      if (rs.every(function (r) { return r.status === 0 || r.status >= 520; })) {
        row("bad", "Supabase database", "did not answer at all. This is why cards, buttons and admin can fail together.", "Open supabase.com, open your project. If it says Paused, tap Restore project and wait 3 minutes. Then tap Check again.");
        return null;
      }
      rs.forEach(function (r, i) {
        var t = TABLES[i], code = r.json && r.json.code;
        if (r.status === 200 && t[3] === "private" && r.json && r.json.length) row("bad", t[0], "SECURITY PROBLEM: a signed-out visitor can read rows of " + t[1], "Tell Claude right away. Row security needs fixing on this table.");
        else if (r.status === 200 && t[3] === "private") row("ok", t[0], t[1] + " (private, as it should be)");
        else if (r.status === 200) row("ok", t[0], t[1]);
        else if (r.status === 401 || r.status === 403 || code === "42501") row("ok", t[0], t[1] + " (private, as it should be)");
        else if (r.status === 404 || code === "42P01" || code === "PGRST205") row("bad", t[0], "table not found: " + t[1], t[2] || "Table is missing. Tell Claude.");
        else row("warn", t[0], "unexpected answer (" + r.status + ")", "");
      });
      section("4. Database functions");
      return Promise.all(RPCS.map(function (f) { return api("/rest/v1/rpc/" + f[0], { method: "POST", body: JSON.stringify(f[1]) }); }));
    }).then(function (rs) {
      if (!rs) return;
      rs.forEach(function (r, i) {
        var f = RPCS[i], code = r.json && r.json.code;
        if (code === "PGRST202" || r.status === 404) row("bad", f[0], "function not found: " + f[2], f[3]);
        else if (r.status === 0) row("warn", f[0], "could not reach Supabase", "Check your internet connection.");
        else row("ok", f[0], f[2]);
      });
    });
  }
  function checkFunctions() {
    section("5. Paystack backend (optional until you set up Paystack)");
    var names = ["delivery-pay", "partner-bank", "payout-run", "paystack-webhook"];
    return Promise.all(names.map(function (n) { return api("/functions/v1/" + n, { method: "POST", body: "{}" }); })).then(function (rs) {
      rs.forEach(function (r, i) { if (r.status === 404) row("warn", names[i], "not deployed yet. Fine until you set up Paystack", "Follow SETUP.md when you are ready."); else if (r.status === 0) row("warn", names[i], "could not reach it", ""); else row("ok", names[i], "deployed"); });
    });
  }

  /* ---- 6. Open the real pages, record script errors, and tap the main buttons ---- */
  var PAGES = [
    ["index.html", "Shop", true],
    ["seller/index.html", "Seller app", true],
    ["rider/index.html", "Rider app", false],
    ["admin.html", "Admin", false]
  ];
  var TAPS = [
    [".quick-link[data-action=delivery]", "Delivery quick link"],
    [".quick-link[data-feature=orders]", "My orders quick link"],
    [".quick-link[data-feature=messages]", "Messages quick link"],
    [".mobile-nav [data-action=sell]", "Sell (bottom bar)"],
    [".mobile-nav [data-action=cart]", "Cart (bottom bar)"],
    ["#mobile-menu-btn", "Menu (bottom bar)"],
    [".signin-btn", "Sign in button"],
    [".footer-col [data-action=safety]", "Safety tips (footer)"],
    [".category-button[data-category=Fashion]", "Fashion category"]
  ];
  function dirOf(p) { var u = new URL(p, location.href); return u.href.replace(/[^\/]*$/, ""); }
  function probe(page) {
    return get(page[0] + "?hc=" + Date.now()).then(function (r) {
      if (!r.ok) return { page: page, missing: true };
      var guard = "<base href=\"" + dirOf(page[0]) + "\"><script>window.__errs=[];" +
        "window.addEventListener('error',function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href)){__errs.push('failed to load '+(t.src||t.href).split('/').slice(-2).join('/'));}else{__errs.push(String(e.filename||'').split('/').pop()+':'+e.lineno+' '+e.message);}},true);" +
        "window.addEventListener('unhandledrejection',function(e){__errs.push('promise: '+((e.reason&&e.reason.message)||e.reason));});<\/script>";
      var html = r.text.replace(/<head[^>]*>/i, function (m) { return m + guard; });
      var f = document.createElement("iframe");
      f.style.cssText = "position:fixed;left:-9999px;top:0;width:420px;height:800px;border:0";
      f.srcdoc = html; document.body.appendChild(f);
      return new Promise(function (res) { setTimeout(res, 7000); }).then(function () {
        var w = f.contentWindow, d = f.contentDocument, res = { page: page, loadErrors: [], taps: [] };
        try { res.loadErrors = (w.__errs || []).slice(); } catch (e) { res.loadErrors = ["could not inspect: " + e.message]; }
        if (!page[2]) { f.remove(); return res; }
        function snap() { return [d.querySelectorAll(".open,.show,[open]").length, d.body.className, d.body.children.length, (d.body.innerText || "").length].join("|"); }
        var chain = Promise.resolve();
        TAPS.forEach(function (t) {
          chain = chain.then(function () {
            var el = d.querySelector(t[0]);
            if (!el) { res.taps.push({ name: t[1], state: "missing" }); return; }
            var before = snap(), n = w.__errs.length;
            try { el.click(); } catch (e) { w.__errs.push("click: " + e.message); }
            return new Promise(function (x) { setTimeout(x, 700); }).then(function () {
              var err = w.__errs.slice(n), changed = snap() !== before;
              res.taps.push({ name: t[1], state: err.length ? "error" : changed ? "ok" : "nothing", err: err });
              d.querySelectorAll(".modal-backdrop.open,.drawer.open,.drawer-backdrop.open").forEach(function (o) { o.classList.remove("open"); });
            });
          });
        });
        return chain.then(function () { try { res.allErrors = w.__errs.slice(); } catch (e) {} f.remove(); return res; });
      });
    });
  }
  function checkPages() {
    section("6. Real page test (opens each page and taps the main buttons)");
    return Promise.all(PAGES.map(probe)).then(function (list) {
      list.forEach(function (r) {
        var name = r.page[1];
        if (r.missing) { row("bad", name, "page file not found", "Upload " + r.page[0] + "."); return; }
        var le = r.loadErrors.filter(function (e) { return !/serviceworker|service worker/i.test(e); });
        if (le.length) row("bad", name + ": errors while loading", le.slice(0, 5).join("  |  "), "Send me this report. Each error names the file and line.");
        else row("ok", name + ": opens with no script errors", "");
        (r.taps || []).forEach(function (t) {
          if (t.state === "ok") row("ok", name + ": " + t.name, "responds");
          else if (t.state === "missing") row("warn", name + ": " + t.name, "button not found on this page", "");
          else if (t.state === "error") row("bad", name + ": " + t.name, "error when tapped: " + t.err.slice(0, 3).join("  |  "), "Send me this report.");
          else row("warn", name + ": " + t.name, "tapped, but nothing happened", "Tell me if this button should do something.");
        });
      });
    });
  }
  function run() {
    out.innerHTML = ""; report = ["SafeBuy NG health check " + new Date().toISOString() + " " + location.href]; counts = { ok: 0, bad: 0, warn: 0 };
    sum.textContent = "Checking…"; var cb = document.getElementById("copy"); cb.disabled = true; cb.textContent = "Copy report (wait…)";
    checkFiles().then(checkDb).then(checkFunctions).then(checkPages).then(function () {
      sum.textContent = counts.bad ? "❌ " + counts.bad + " problem" + (counts.bad === 1 ? "" : "s") + " found. " + counts.ok + " checks passed." : "✅ Everything checked is in place. " + counts.ok + " checks passed.";
      report.unshift(sum.textContent);
    }).catch(function (e) { sum.textContent = "The check itself failed: " + e.message; }).then(function () { var cb = document.getElementById("copy"); cb.disabled = false; cb.textContent = "Copy report"; });
  }
  document.getElementById("again").addEventListener("click", run);
  document.getElementById("copy").addEventListener("click", function () {
    var t = report.join("\n"); if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { document.getElementById("copy").textContent = "Copied"; });
  });
  run();
})();
</script>
</body>
</html>
