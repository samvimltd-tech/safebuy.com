# SafeBuy NG load test. Run by hand: Actions tab > Load test > Run workflow. Reads only (home page + public product list), so it creates no data.
# Keep the numbers small: every request uses a little of your free data allowance.
name: Load test
on:
  workflow_dispatch:
    inputs:
      users: { description: "Pretend visitors at the same moment (max 200)", default: "50" }
      rounds: { description: "Requests per visitor (max 20)", default: "10" }
jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run
        env: { USERS: "${{ inputs.users }}", ROUNDS: "${{ inputs.rounds }}" }
        run: |
          cat > lt.js <<'JS'
          const fs = require("fs");
          const users = Math.min(200, +process.env.USERS || 50), rounds = Math.min(20, +process.env.ROUNDS || 10);
          const cfg = fs.readFileSync("supabase-config.js", "utf8");
          const url = (cfg.match(/https:\/\/[A-Za-z0-9-]+\.supabase\.co/) || [])[0];
          const key = (cfg.match(/sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+/) || [])[0];
          const site = `https://${process.env.GITHUB_REPOSITORY_OWNER}.github.io/${process.env.GITHUB_REPOSITORY.split("/")[1]}/`;
          const targets = [
            ["home page", site, {}],
            ["products list", `${url}/rest/v1/seller_products_public?select=id,name,price_kobo&limit=40`, { apikey: key, Authorization: "Bearer " + key }],
          ];
          const pct = (a, p) => a.sort((x, y) => x - y)[Math.min(a.length - 1, Math.floor(a.length * p))];
          (async () => {
            for (const [name, u, h] of targets) {
              const times = []; let bad = 0;
              await Promise.all(Array.from({ length: users }, async () => {
                for (let i = 0; i < rounds; i++) { const t = Date.now(); try { const r = await fetch(u, { headers: h }); await r.arrayBuffer(); if (!r.ok) bad++; } catch (e) { bad++; } times.push(Date.now() - t); }
              }));
              console.log(`${name}: ${times.length} requests, ${bad} failed, median ${pct(times, .5)} ms, 95% under ${pct(times, .95)} ms, slowest ${Math.max(...times)} ms`);
              if (bad > times.length * 0.02) process.exitCode = 1;
            }
          })();
          JS
          node lt.js
