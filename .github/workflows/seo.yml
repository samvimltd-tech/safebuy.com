# Rebuilds shop pages, product pages and sitemap.xml from the live product list. Runs every 30 minutes and on demand.
name: Update SEO pages and sitemap
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: seo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate pages
        run: python3 seo/generate.py
      - name: Save changes
        run: | git config user.name "safebuy-seo-bot" git config user.email "seo-bot@users.noreply.github.com" git add -A shop p sitemap.xml robots.txt if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update SEO pages and sitemap" && git push; fi
