# Keeps the free Supabase project awake: pings it once a day so it is not paused for inactivity.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * *"     # every day at 06:17 UTC
  workflow_dispatch: {}      # lets you also run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -o 'https://[A-Za-z0-9-]*\.supabase\.co' supabase-config.js | head -1)
          KEY=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+' supabase-config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Could not read supabase-config.js"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/site_content?select=key&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered with HTTP $CODE"
          case "$CODE" in 2*|401|403) exit 0 ;; *) exit 1 ;; esac
