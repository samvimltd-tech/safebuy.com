name: Sync products
on:
  repository_dispatch:
    types: [products-changed]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
concurrency:
  group: sync
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node YOUR_GENERATOR_SCRIPT.js
      - run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync products" && git push)
