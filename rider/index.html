<title>SafeBuy Rider</title>
<style>

:root{--green:#087f5b;--green-dark:#066548;--green-light:#e7f7ef;--ink:#172b24;--muted:#718078;--line:#e6ece8;--background:#f7f9f7;--white:#fff;--orange:#ffb454;--radius:18px;--header-h:68px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #78d3ad;outline-offset:2px}
.announcement{padding:8px 16px;text-align:center;background:var(--green-dark);color:#fff;font-size:12px}
.container{width:min(1160px,100% - 36px);margin:auto}

/* ---------- Header ---------- */
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.header-row{min-height:var(--header-h);display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;color:#fff;background:var(--green);font-size:22px;font-weight:800}
.brand-name{font-size:22px;font-weight:800;letter-spacing:-.8px}
.brand-name span{color:var(--green)}
.desktop-nav{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700}
.nav-link,.dd>button.dd-toggle{display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap}
.nav-link:hover,.dd>button.dd-toggle:hover,.dd.open>button.dd-toggle{background:var(--green-light);color:var(--green-dark)}
.nav-link.active{color:var(--green)}
.caret{font-size:10px;transition:transform .15s}
.dd.open .caret{transform:rotate(180deg)}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:230px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #173b2822;display:none;z-index:50}
.dd.right .dd-menu{left:auto;right:0}
.dd.open .dd-menu{display:block}
.dd-menu a,.dd-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:14px;font-weight:600;text-align:left}
.dd-menu a:hover,.dd-menu button:hover{background:var(--green-light);color:var(--green-dark)}
.dd-menu .ico{width:22px;text-align:center}
.dd-menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.dd-menu .dd-label{padding:6px 12px 4px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.dd-menu .dd-user{padding:8px 12px;font-size:13px;color:var(--muted);word-break:break-all}
.header-actions{display:flex;align-items:center;gap:8px}
.button{border:0;border-radius:12px;padding:12px 17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.button-primary{background:var(--green);color:#fff}
.button-primary:hover{background:var(--green-dark)}
.button-light{background:var(--green-light);color:var(--green-dark)}
.button-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.button[disabled]{opacity:.55;cursor:not-allowed}
.header-actions .button{padding:10px 14px;font-size:14px}
.cart-button{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;white-space:nowrap;font-size:14px}
.cart-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;margin-left:4px;background:var(--green);color:#fff;border-radius:20px;font-size:12px}
.menu-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;line-height:1}

/* ---------- Delivery bar ---------- */
.delivery-bar{background:#fff8e8;border-bottom:1px solid #f1d69a;color:#79551b;font-size:13px}
.delivery-bar.ok{background:var(--green-light);border-color:#bfe6d1;color:var(--green-dark)}
.delivery-bar .container{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 0;text-align:center}
.delivery-bar button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;padding:2px 4px;font-size:13px}

/* ---------- Mobile drawer ---------- */
.drawer-backdrop{position:fixed;inset:0;z-index:45;background:#10271d99;display:none}
.drawer-backdrop.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:46;width:min(340px,88vw);background:#fff;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0002}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-body{flex:1;overflow-y:auto;padding:8px 10px 24px;-webkit-overflow-scrolling:touch}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 8px;font-weight:800;font-size:15px;cursor:pointer}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary::after{content:"▾";font-size:12px;color:var(--muted);transition:transform .15s}
.drawer details[open] summary::after{transform:rotate(180deg)}
.drawer .d-links{padding:0 0 10px}
.drawer .d-links a,.drawer .d-links button,.drawer .d-single{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border:0;background:transparent;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.drawer .d-links a:active,.drawer .d-links button:active,.drawer .d-single:active{background:var(--green-light)}
.drawer .d-single{font-weight:800;border-bottom:1px solid var(--line);border-radius:0;padding:14px 8px}
.drawer .d-user{padding:10px 8px;color:var(--muted);font-size:13px;word-break:break-all}

/* ---------- Hero ---------- */
.hero{padding:30px 0 24px}
.hero-panel{display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:28px;min-height:320px;padding:clamp(25px,5vw,55px);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 85% 20%,#d5f2df 0,transparent 32%),linear-gradient(120deg,#eaf8ef,#f6fbf6)}
.eyebrow{display:inline-block;padding:7px 11px;border-radius:30px;background:#fff;color:var(--green-dark);font-size:12px;font-weight:800;letter-spacing:.4px}
.hero h1{margin:17px 0 13px;max-width:620px;font-size:clamp(34px,5.5vw,56px);line-height:1.08;letter-spacing:-1.8px}
.hero h1 span{color:var(--green)}
.hero p{max-width:520px;color:#52675c;font-size:16px;line-height:1.8}
.hero-buttons{display:flex;flex-wrap:wrap;gap:11px;margin-top:22px}
.hero-art{min-height:220px;display:grid;place-items:center;position:relative}
.art-circle{width:min(240px,100%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#c7ecd4;font-size:clamp(80px,12vw,130px);box-shadow:0 20px 50px #087f5b18}
.floating-note{position:absolute;bottom:5px;right:0;background:#fff;padding:12px 15px;border-radius:14px;box-shadow:0 8px 25px #173b2812;font-size:13px;font-weight:700}
.quick-links{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 22px}
.quick-link{display:flex;align-items:center;gap:11px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:left;color:var(--ink);font-weight:700;font-size:14px}
.quick-link:hover{border-color:var(--green);background:var(--green-light)}
.quick-link .ql-ico{display:grid;place-items:center;flex-shrink:0;width:38px;height:38px;border-radius:11px;background:var(--green-light);font-size:19px}
.quick-link small{display:block;color:var(--muted);font-weight:400;font-size:12px}
html[data-hide-pulse] #pulse-main{display:none!important}
.prototype-notice{margin:0 auto 20px;padding:13px 16px;border:1px solid #f1d69a;background:#fff8e8;border-radius:13px;color:#79551b;font-size:13px}
.prototype-notice strong{color:#66440c}

/* ---------- Sections / shop ---------- */
.section{padding:22px 0;scroll-margin-top:calc(var(--header-h) + 16px)}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}
.section-heading h2{margin:0;font-size:clamp(24px,4vw,31px);letter-spacing:-.7px}
.section-heading p{margin:5px 0 0;color:var(--muted);font-size:14px}
.search-wrap{margin-bottom:14px}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dce5de;border-radius:15px;padding:5px 6px 5px 16px;box-shadow:0 5px 20px #173b2806}
.search-icon{color:var(--green);font-size:22px}
.search-box input{width:100%;min-width:0;border:0;outline:none;background:transparent;padding:12px 0;color:var(--ink);font-size:16px}
.search-box input::placeholder{color:#98a39c}
.search-box button{flex-shrink:0}
.categories{display:flex;gap:9px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.category-button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:30px;padding:10px 17px;color:#52645a;font-size:13px;font-weight:700}
.category-button.active,.category-button:hover{background:var(--green);color:#fff;border-color:var(--green)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.results-line{margin:0;color:var(--muted);font-size:13px}
.sort-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sort-row select{width:auto;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.product-card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .2s,box-shadow .2s}
.product-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #173b2810}
.product-art{position:relative;min-height:175px;aspect-ratio:1.15/1;display:grid;place-items:center;font-size:75px;background:#edf6ef;cursor:pointer}
.product-art .tag{position:absolute;top:11px;left:11px;z-index:1;padding:5px 8px;border-radius:8px;background:#fff;color:var(--green-dark);font-size:10px;font-weight:800}
.product-info{padding:14px}
.product-category{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.product-info h3{margin:7px 0 8px;font-size:15px;line-height:1.4;min-height:42px;overflow-wrap:anywhere}
.seller-name{margin:0 0 10px;color:var(--muted);font-size:12px}
.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.price{color:var(--ink);font-size:17px;font-weight:800}
.product-bottom .rating{color:#a66a0b;font-size:11px;white-space:nowrap}
.product-actions{display:grid;grid-template-columns:1fr auto;gap:7px}
.product-actions .button{padding:10px 9px;font-size:12px}
.icon-button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;color:var(--green);font-size:17px}
a.icon-button{display:inline-grid;place-items:center;text-decoration:none}
.product-info h3 a{color:inherit}
.product-info h3 a:hover{color:var(--green)}
.empty-state{grid-column:1/-1;padding:40px 18px;border:1px dashed #cbd9ce;border-radius:18px;text-align:center;background:#fff}
.empty-state p{color:var(--muted)}
.trust-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.trust-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.trust-icon{display:grid;place-items:center;width:43px;height:43px;background:var(--green-light);border-radius:13px;font-size:22px}
.trust-card h3{margin:13px 0 7px;font-size:16px}
.trust-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.sell-panel{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:clamp(24px,4vw,38px);border-radius:22px;background:#173b2c;color:#fff}
.sell-panel h2{margin:0 0 9px;font-size:clamp(24px,4vw,32px)}
.sell-panel p{max-width:580px;margin:0;color:#d4e6dc;font-size:14px;line-height:1.8}
.sell-panel .button{flex-shrink:0;background:#d8f5e3;color:#145338}
footer{margin-top:34px;padding:35px 0 40px;background:#fff;border-top:1px solid var(--line)}
.footer-row{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footer-row p{color:var(--muted);font-size:13px;max-width:420px}
.footer-cols{display:flex;gap:40px;flex-wrap:wrap}
.footer-col h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.footer-col a,.footer-col button{display:block;padding:4px 0;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.footer-col a:hover,.footer-col button:hover{color:var(--green)}
.mobile-nav{display:none}
.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:13px 18px;border-radius:13px;background:#173b2c;color:#fff;font-size:14px;box-shadow:0 8px 30px #0002;z-index:80;display:none}
.toast.show{display:block}

/* ---------- Modals ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:60;padding:20px;background:#10271dcc;display:none;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{width:min(450px,100%);max-height:88vh;max-height:88dvh;overflow-y:auto;padding:24px;background:#fff;border-radius:22px;-webkit-overflow-scrolling:touch}
.modal-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.modal h2{margin:0 0 12px}
.modal-art{display:grid;place-items:center;min-height:180px;margin:14px 0;border-radius:16px;background:#edf6ef;font-size:90px}
.modal p{color:var(--muted);line-height:1.7}
.modal .button{width:100%;margin-top:12px}
.modal label{display:block;margin:12px 0 5px;font-size:13px;font-weight:700}
.modal input{width:100%;padding:12px 13px;border:1px solid #dce5de;border-radius:12px;outline:none;font-size:16px}
.modal input:focus{border-color:var(--green)}
.source-banner{margin:0 0 14px;padding:11px 14px;border-radius:12px;font-size:13px;border:1px solid var(--line);background:#fff}
.source-banner.supabase{background:var(--green-light);border-color:#bfe6d1;color:var(--green-dark);font-weight:700}
.source-banner.error{background:#fff3e0;border-color:#f1c27d;color:#7a4a05}
.source-banner.sample{background:#fff3e0;border-color:#f1c27d;color:#7a4a05}
.source-banner.loading{color:var(--muted)}
.product-art img,.modal-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal-art{position:relative;overflow:hidden}
.modal textarea,.modal select{width:100%;padding:12px 13px;border:1px solid #dce5de;border-radius:12px;outline:none;background:#fff;font:inherit;font-size:16px;color:var(--ink)}
.modal textarea{min-height:84px;resize:vertical}
.modal textarea:focus,.modal select:focus{border-color:var(--green)}
.modal h3{margin:20px 0 8px;font-size:16px}
.modal .muted{color:var(--muted);font-size:13px}
.status-pill{display:inline-block;margin:0 0 6px;padding:5px 11px;border-radius:30px;font-size:12px;font-weight:800;background:#fff3e0;color:#7a4a05}
.status-pill.ok{background:var(--green-light);color:var(--green-dark)}
.status-pill.bad{background:#fdeaea;color:#8a1f1f}
.seller-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.seller-row .button{width:auto;margin:0;padding:8px 12px;font-size:12px}
.review-card{padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:14px;font-size:13px;line-height:1.6}
.review-card .button{width:auto;margin:8px 8px 0 0;padding:9px 14px;font-size:13px}
.form-message{min-height:20px;margin:10px 0 0;font-size:13px}
.modal label.check{display:flex;align-items:flex-start;gap:9px;margin:14px 0 4px;font-weight:400;font-size:13px;line-height:1.5}
.modal label.check input{width:auto;margin-top:3px}
.modal .button-outline{margin-top:10px}
.badge{display:inline-block;margin-left:5px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:800;background:#fff3e0;color:#7a4a05;vertical-align:1px}
.badge.ok{background:var(--green-light);color:var(--green-dark)}
.seller-item{padding:12px 0;border-top:1px solid var(--line)}
.seller-item-top{display:flex;gap:12px;align-items:center}
.seller-item .thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#edf6ef;flex-shrink:0}
.seller-item .grow{flex:1;min-width:0;font-size:14px}
.seller-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.seller-actions .button{width:auto;margin:0;padding:8px 11px;font-size:12px}
.modal-note{padding:11px 13px;border-radius:12px;background:#fff8e8;border:1px solid #f1d69a;color:#79551b!important;font-size:13px;line-height:1.6}
/* delivery areas */
.area-list{margin:10px 0 0;padding:0;list-style:none;max-height:42vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.area-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14px}
.area-list li:last-child{border-bottom:0}
.area-list li button{width:auto;margin:0;padding:6px 11px;font-size:12px}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;background:#fff3e0;color:#7a4a05;white-space:nowrap}
.chip.ok{background:var(--green-light);color:var(--green-dark)}
.area-group{margin:16px 0 4px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}

.header-actions>#mp-orders-btn,.header-actions>#mp-shop-btn,.header-actions>#do-btn,.header-actions>#sb-myshop,.header-actions>#role-pill{display:none!important}
body.sb-in .signin-btn,body.sb-in .buyer-header{display:none!important}
body:not(.sb-in) .dd-account{display:none!important}
body.sb-seller .cart-button,body.sb-seller .mobile-nav [data-action=cart]{display:none!important}
.footer-col.footer-links{display:block}
.mode-chip{display:inline-block;margin-left:6px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;background:var(--green-light);color:var(--green-dark)}
body.sb-seller .mode-chip{background:#fff3e0;color:#7a4a05}
@media (max-width:1000px){
.nav-link,.dd>button.dd-toggle{padding:9px 9px}
.header-actions .sell-header{display:none}
.quick-links{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero-panel{grid-template-columns:1.15fr .85fr}
.desktop-nav,.header-actions .dd-account,.header-actions .delivery-btn,.header-actions .buyer-header{display:none!important}
.menu-toggle{display:inline-grid;place-items:center}
}
@media (max-width:650px){
:root{--header-h:60px}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
.container{width:calc(100% - 26px)}
.announcement{font-size:11px}
.header-row{gap:8px}

<script>
/* Loads the Supabase library WITHOUT blocking the page (3 sources, first one that answers wins),
   so the cards and buttons work while it downloads. */
(function () {
  var ROOT = location.pathname.replace(/\/(seller|rider)\/[^\/]*$/, "/").replace(/[^\/]*$/, "");
  var SRC = [ROOT + "vendor/supabase-2.45.4.js",     // our own copy first: fast and cannot go down
             "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
             "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js",
             "https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"];
  var libQ = [], readyQ = [], ready = false, tried = {};
  function run(q) { while (q.length) { try { q.shift()(); } catch (e) { console.error(e); } } }
  window.__sbLibLoaded = function (fn) { if (window.supabase) fn(); else libQ.push(fn); };
  window.__sbWhenReady = function (fn) { if (ready) fn(); else readyQ.push(fn); };
  window.__sbMarkReady = function () { if (ready) return; ready = true; run(readyQ); };
  function add(n) {
    if (window.supabase || n >= SRC.length || tried[n]) return; tried[n] = 1;
    var s = document.createElement("script"); s.src = SRC[n]; s.async = true;
    s.onload = function () { if (window.supabase) run(libQ); };
    s.onerror = function () { add(n + 1); };
    document.head.appendChild(s);
    setTimeout(function () { if (!window.supabase) add(n + 1); }, 6000);
  }
  add(0);
  /* Watchdog: if one of our own files fails to load, offer a one-tap repair instead of a silently dead page. */
  var shown = false;
  function repairBar() {
    if (shown || !document.body) return; shown = true;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:10px;right:10px;top:10px;z-index:99998;background:#b91c1c;color:#fff;border-radius:14px;padding:12px 14px;font:700 14px/1.4 system-ui,sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)";
    d.innerHTML = '<span style="flex:1">Part of the page did not load.</span><a href="' + ROOT + 'reset.html" style="background:#fff;color:#b91c1c;border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:800">Tap to repair</a><button type="button" aria-label="Close" style="border:0;background:transparent;color:#fff;font-size:18px">\u2715</button>';
    d.querySelector("button").onclick = function () { d.remove(); };
    document.body.appendChild(d);
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "SCRIPT" && t.src && t.src.indexOf(location.origin) === 0 && !/vendor\//.test(t.src)) setTimeout(repairBar, 1500);
  }, true);
  setTimeout(function () { if (!window.supabase) repairBar(); }, 20000);
  setTimeout(function () { if (!window.supabase) window.__sbMarkReady(); }, 25000);
})();
</script>

<script>
/* The page scripts start as soon as the database connection is ready (or has failed), in order. */
(function () {
  var started = false;
  function go() {
    if (started) return; started = true;
    var list = Array.prototype.slice.call(document.querySelectorAll('script[type="text/sb-defer"]'));
    var note = document.getElementById("rd-conn"); if (note) note.remove();
    (function next() {
      var o = list.shift(); if (!o) return;
      var n = document.createElement("script");
      if (o.getAttribute("src")) { n.src = o.getAttribute("src"); n.async = false; n.onload = n.onerror = next; document.body.appendChild(n); }
      else { n.textContent = o.textContent; document.body.appendChild(n); next(); }
    })();
  }
  window.__sbLibLoaded(function () { setTimeout(go, 0); });
  window.__sbWhenReady(go);
  setTimeout(function () { if (window.__sbMarkReady) window.__sbMarkReady(); }, 0 + 26000);
})();
</script>

    try { window.safeBuySupabase = window.supabase.createClient(cfg.url, cfg.publishableKey); } catch (e) { console.error(e); }

})();

    $("rd-title").textContent = su ? "Become a rider" : fg ? "Reset your password" : np ? "Set a new password" : "Rider sign in";
    $("rd-lead").textContent = su ? "Create your account, then tell us about you and your vehicle." : fg ? "Enter your email and we will send you a reset link." : np ? "Choose a new password. Use at least 8 characters." : "Deliver for SafeBuy NG and get paid for every trip.";

    e.preventDefault();
    formUsed = Date.now();
    var email = $("rd-email").value.trim(), pw = $("rd-pw").value, btn = $("rd-submit");
    btn.disabled = true; say("Please wait…");
    try {
      if (mode === "forgot") {
        if (!email) { say("Enter your email address first."); return; }
        var rr = await c.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if (rr.error) throw rr.error;
        say("If that email is registered, a reset link is on its way. Check your inbox and your spam folder, then tap the link.");
        return;
      }
      if (mode === "newpass") {
        if (pw.length < 8) { say("Use at least 8 characters."); return; }
        if (pw !== $("rd-pw2").value) { say("The two passwords do not match."); return; }
        var up = await c.auth.updateUser({ password: pw });
        if (up.error) throw up.error;
        recovering = false; window.__sbRecovery = false;
        try { history.replaceState(null, "", location.pathname + location.search); } catch (x) {}
        $("rd-pw").value = ""; $("rd-pw2").value = "";
        say("Your password has been changed.");
        setTimeout(function () { setMode("signin"); enter(); }, 900);
        return;
      }
      if (!email || pw.length < 8) { say("Enter your email and a password of at least 8 characters."); return; }
      if (mode === "signup") {
        var name = $("rd-name").value.trim();
        if (!name) { say("Enter your full name."); return; }
        var r = await c.auth.signUp({ email: email, password: pw, options: { data: { full_name: name }, emailRedirectTo: location.origin + location.pathname } });
        if (r.error) throw r.error;
        say(r.data.session ? "Account created." : "Account created. Check your email to confirm your address, then sign in.");
      } else {
        var s = await c.auth.signInWithPassword({ email: email, password: pw });
        if (s.error) throw s.error;
        say("Signed in.");
      }
    } catch (err) {
      say(err.message || "We could not complete that. Please try again.");
    } finally { btn.disabled = false; }
  });

  /* ---------- who is signed in ---------- */
  function nameOf(u) {
    if (!u) return "";
    var md = u.user_metadata || {};
    return String(md.full_name || md.name || (u.email ? String(u.email).split("@")[0] : "")).trim();
  }
  function showWho(u) { var n = nameOf(u); $("role-who").textContent = n ? "· Signed in as " + n : "· Not signed in"; }

  function enter() {
    try { localStorage.setItem("sb-rider", "1"); } catch (e) {}
    document.body.classList.remove("rd-out");
    $("rd-signout").hidden = false;
    if (!started) { started = true; $("rd-go").click(); }
  }
  function leave() {
    document.body.classList.add("rd-out");
    $("rd-signout").hidden = true;
    started = false;
  }
  $("rd-refresh").addEventListener("click", function () { $("rd-go").click(); });
  $("rd-signout").addEventListener("click", function () {
    $("rd-signout").disabled = true;
    c.auth.signOut().then(function () { location.reload(); }, function () { location.reload(); });
  });

  c.auth.onAuthStateChange(function (event, session) {
    showWho(session ? session.user : null);
    if (event === "PASSWORD_RECOVERY") { recovering = true; leave(); setMode("newpass"); return; }
    if (session && !recovering) {
      var viaForm = Date.now() - formUsed < 30000;
      enter();
      if (viaForm) { formUsed = 0; setTimeout(function () { showInstall(true, true); }, 1500); }
      else setTimeout(function () { showInstall(false, true); }, 1500);
    } else if (!session) { leave(); }
  });
  c.auth.getSession().then(function (r) {
    var s = r && r.data && r.data.session;
    showWho(s ? s.user : null);
    if (s && !recovering) enter();
  });
  if (window.__sbLinkError) {
    setMode("forgot");
    say("That reset link has expired or was already used. Enter your email to get a new one.");
  }
  if (recovering) setMode("newpass"); else if (!window.__sbLinkError) setMode("signin");

  /* ---------- new job request: sound + vibration ---------- */
  var audio = null;
  function unlockAudio() {
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {}
  }
  document.addEventListener("click", unlockAudio);
  document.addEventListener("touchstart", unlockAudio, { passive: true });
  function ding() {
    try {
      if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
      if (!audio) return;
      [0, 0.28, 0.56].forEach(function (d, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.type = "sine"; o.frequency.value = i === 1 ? 1175 : 880;
        g.gain.setValueAtTime(0.0001, audio.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.35, audio.currentTime + d + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + d + 0.24);
        o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.26);
      });
    } catch (e) {}
  }
  var hadOffer = false, baseTitle = document.title;
  new MutationObserver(function () {
    var has = !!document.querySelector("#dp-offer .dp-offer, .dp-offer");
    if (has && !hadOffer) {
      ding();
      document.title = "🔔 New delivery request!";
      setTimeout(function () { document.title = baseTitle; }, 8000);
    }
    hadOffer = has;
  }).observe($("rd-slot"), { childList: true, subtree: true });

  /* ---------- install card ---------- */
  var KEY = "role-install-rider", deferred = null, card = null;
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  function standalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener("appinstalled", function () { store(KEY + "-done", "1"); hideInstall(); });
  function hideInstall() { if (card) { card.remove(); card = null; } }
  function showInstall(force, ready) {
    if (card || standalone() || store(KEY + "-done")) return;
    var later = Number(store(KEY + "-later") || 0);
    if (!force && later && Date.now() - later < 3 * 86400000) return;
    var ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua), inapp = /FBAN|FBAV|Instagram|Telegram|Line\//i.test(ua);
    card = document.createElement("div");
    card.style.cssText = "position:fixed;left:0;right:0;top:0;bottom:0;z-index:95;background:rgba(10,42,31,.62);display:flex;align-items:flex-end;justify-content:center";
    card.innerHTML = '<div role="dialog" aria-modal="true" style="width:100vw;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));font-family:system-ui,sans-serif;color:#172b24;text-align:center">' +
      '<div style="width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:#12372a;color:#fff;font:800 34px/64px system-ui,sans-serif">R</div>' +
      '<h2 style="margin:0 0 6px;font-size:21px">Install SafeBuy Rider</h2>' +
      '<p style="margin:0 0 16px;color:#52645a;font-size:15px;line-height:1.5">' + (ready ? 'Your account is ready. ' : '') + 'Add the app to your home screen to open your deliveries in one tap, with no browser bar.</p>' +
      '<button id="ri-go" type="button" style="width:100%;border:0;border-radius:14px;padding:15px;background:#12372a;color:#fff;font:800 16px system-ui,sans-serif">' + (ios ? "Show me how" : "Install app") + '</button>' +
      '<div id="ri-help" style="display:none;margin:12px 0 0;padding:12px;border-radius:12px;background:#f1f7f3;font-size:14px;line-height:1.55;text-align:left"></div>' +
      '<button id="ri-later" type="button" style="margin-top:10px;border:0;background:transparent;color:#52645a;font:700 14px system-ui,sans-serif;padding:10px">Not now</button></div>';
    document.body.appendChild(card);
    var help = card.querySelector("#ri-help");
    card.querySelector("#ri-go").addEventListener("click", function () {
      if (deferred && !ios) {
        var p = deferred; deferred = null; p.prompt();
        if (p.userChoice) p.userChoice.then(function (r) { if (r && r.outcome === "accepted") store(KEY + "-done", "1"); hideInstall(); });
      } else {
        help.style.display = "block";
        help.innerHTML = inapp ? "This page is open inside another app. Tap the menu and choose <b>Open in browser</b> (Chrome or Safari), then install from there."
          : ios ? "1. Tap the <b>Share</b> button in Safari (the square with an arrow).<br>2. Scroll and tap <b>Add to Home Screen</b>.<br>3. Tap <b>Add</b>."
          : "Tap the <b>menu (three dots)</b> at the top of your browser, then tap <b>Install app</b> or <b>Add to Home screen</b>.";
      }
    });
    card.querySelector("#ri-later").addEventListener("click", function () { store(KEY + "-later", String(Date.now())); hideInstall(); });
  }

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function () {});
})();
</script>
</body>
</html>
