<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SafeBuy NG Admin</title>
<style>
:root{--green:#087f5b;--green-dark:#066548;--green-light:#e7f7ef;--ink:#172b24;--muted:#718078;--line:#e6ece8;--bg:#f7f9f7;--red:#8a1f1f;--amber:#7a4a05}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
button,input,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(920px,100% - 28px);margin:0 auto;padding:18px 0 60px}
.narrow{width:min(420px,100% - 28px);padding-top:12vh}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
h1{margin:0 0 4px;font-size:24px}
.muted{color:var(--muted);font-size:13px}
label{display:block;margin:14px 0 5px;font-size:13px;font-weight:700}
input,select{width:100%;padding:12px 13px;border:1px solid #dce5de;border-radius:12px;outline:none;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{border-color:var(--green);outline:2px solid #087f5b55;outline-offset:1px}
.button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--green);color:#fff}
.button:hover{background:var(--green-dark)}
.button:disabled{opacity:.6;cursor:default}
.button.light{background:var(--green-light);color:var(--green-dark)}
.button.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.button.danger{background:#fdeaea;color:var(--red)}
.full{width:100%;margin-top:18px}
.msg{min-height:20px;margin:12px 0 0;font-size:13px}
.msg.err{color:var(--red)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.top-actions{display:flex;align-items:center;gap:8px}
.top-actions .button{padding:9px 13px;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#c9a24a}
.dot.on{background:#1fae6f}
.dot.off{background:#c0392b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink)}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert{background:#fff8e8;border-color:#f1d69a}
.stat.alert b{color:var(--amber)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:30px;padding:9px 16px;font-size:13px;font-weight:700;color:#52645a}
.tab.active{background:var(--green);border-color:var(--green);color:#fff}
.count{display:inline-block;min-width:20px;margin-left:5px;padding:0 6px;border-radius:20px;background:#0000001a;font-size:11px;text-align:center}
.tab:not(.active) .count{background:var(--green-light);color:var(--green-dark)}
.tab .count.hot{background:#ffb454;color:#4a2c00}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools input{flex:1;min-width:0}
.tools select{width:auto}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:14px}
.item.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%{background:#d8f5e3;border-color:var(--green)}100%{background:#fff;border-color:var(--line)}}
.item .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item .actions .button{padding:9px 14px;font-size:13px}
.pill{display:inline-block;padding:4px 10px;border-radius:30px;font-size:11px;font-weight:800;background:#fff3e0;color:var(--amber);text-transform:uppercase}
.pill.approved,.pill.published{background:var(--green-light);color:var(--green-dark)}
.pill.rejected,.pill.hidden{background:#fdeaea;color:var(--red)}
.row{display:flex;gap:12px;align-items:flex-start}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#edf6ef;flex-shrink:0}
.grow{flex:1;min-width:0}
.empty{padding:28px 14px;text-align:center;border:1px dashed #cbd9ce;border-radius:14px;background:#fff}
.leads-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f3f7f4;font-size:12px;color:var(--muted)}
tbody tr:last-child td{border-bottom:0}
tr.fresh td{animation:fresh 2.4s ease-out}
td .button{padding:6px 11px;font-size:12px}
@media (max-width:600px){
.stats{grid-template-columns:repeat(2,1fr)}
.tools{flex-wrap:wrap}
.tools select{width:100%}
}
@media (prefers-reduced-motion:reduce){.item.fresh{animation:none}}
</style>
</head>
<body>

<main class="wrap narrow card" id="login-view" hidden>
  <h1>SafeBuy NG Admin</h1>
  <p class="muted">Authorised staff only.</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="button full" type="submit" id="login-btn">Sign in</button>
  </form>
  <p class="msg" id="login-msg" role="status" aria-live="polite"></p>
</main>

<main class="wrap" id="dash-view" hidden>
  <div class="topbar">
    <div>
      <h1>SafeBuy NG Admin</h1>
      <span class="muted" id="who"></span>
    </div>
    <div class="top-actions">
      <span class="live" id="live" title="Live updates"><span class="dot" id="live-dot"></span><span id="live-text">Connecting…</span></span>
      <button class="button outline" type="button" id="refresh-btn">Refresh</button>
      <button class="button outline" type="button" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="main-tabs">
    <button class="tab active" type="button" data-tab="applications">Sellers <span class="count" id="c-sellers">0</span></button>
    <button class="tab" type="button" data-tab="products">Products <span class="count" id="c-products">0</span></button>
    <button class="tab" type="button" data-tab="leads">Lead generation <span class="count" id="c-leads">0</span></button>
    <button class="tab" type="button" data-tab="verify">Verification <span class="count" id="c-verify">0</span></button>
  </div>

  <div class="tabs" id="filter-tabs"></div>

  <div class="tools">
    <input id="search" type="search" placeholder="Search…" aria-label="Search">
    <select id="sort" aria-label="Sort by">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="name">Name A–Z</option>
    </select>
  </div>

  <p class="muted">Suspending a shop hides all of its listings from shoppers. Verifying adds the green Verified badge. Use “Edit category” to fix typos or merge duplicate categories (for example “phones” and “Phone”).</p>
  <p class="msg" id="dash-msg" role="status" aria-live="polite"></p>
  <div id="list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
<script>
(function () {
  "use strict";

  var cfg = window.SAFEbuySupabaseConfig;
  var loginView = document.getElementById("login-view");
  var dashView = document.getElementById("dash-view");
  var loginMsg = document.getElementById("login-msg");
  var dashMsg = document.getElementById("dash-msg");
  var list = document.getElementById("list");
  var statsBox = document.getElementById("stats");
  var filterTabs = document.getElementById("filter-tabs");
  var searchBox = document.getElementById("search");
  var sortBox = document.getElementById("sort");
  var liveDot = document.getElementById("live-dot");
  var liveText = document.getElementById("live-text");
  var client = null;

  var apps = [], prods = [], leadRows = [], leadsErr = "", vrRows = [], vrErr = "";
  var known = null;           // ids already seen, to highlight new arrivals
  var channel = null, pollTimer = null, refreshTimer = null;
  var lastUpdated = null, realtimeOk = false;

  var saved = {};
  try { saved = JSON.parse(sessionStorage.getItem("safebuy-admin-view") || "{}"); } catch (e) {}
  var tab = saved.tab === "products" || saved.tab === "leads" || saved.tab === "verify" ? saved.tab : "applications";
  var filters = { applications: saved.fa || "pending", products: saved.fp || "all", leads: "all", verify: "open" };

  var STATUS_LABEL = { pending: "Unverified", approved: "Verified", rejected: "Suspended", published: "Live", hidden: "Hidden" };
  var BUILTIN_CATS = ["Electronics", "Fashion", "Home", "Beauty", "Groceries"];

  var FILTERS = {
    applications: [
      ["pending", "Unverified"], ["approved", "Verified"], ["rejected", "Suspended"], ["all", "All"]
    ],
    products: [
      ["all", "All"], ["published", "Live"], ["hidden", "Hidden"], ["soldout", "Sold out"]
    ],
    leads: [
      ["all", "All"], ["email", "With email"], ["phone", "With phone"]
    ],
    verify: [
      ["open", "Needs review"], ["approved", "Approved"], ["rejected", "Rejected"], ["expired", "Expired"], ["all", "All"]
    ]
  };

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(kobo) { return "₦" + (Number(kobo || 0) / 100).toLocaleString("en-NG"); }
  function saveView() {
    try {
      sessionStorage.setItem("safebuy-admin-view", JSON.stringify({ tab: tab, fa: filters.applications, fp: filters.products }));
    } catch (e) {}
  }

  function normCat(t) {
    t = String(t || "").replace(/\s+/g, " ").trim().toLowerCase()
      .replace(/(^|[\s&\/-])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
    for (var i = 0; i < BUILTIN_CATS.length; i++) {
      if (BUILTIN_CATS[i].toLowerCase() === t.toLowerCase()) return BUILTIN_CATS[i];
    }
    if (t.toLowerCase() === "home & living") return "Home";
    return t;
  }

  function showLogin(message) {
    dashView.hidden = true;
    loginView.hidden = false;
    loginMsg.className = "msg" + (message ? " err" : "");
    loginMsg.textContent = message || "";
  }
  function showDash() { loginView.hidden = true; dashView.hidden = false; }
  function note(text, isError) {
    dashMsg.className = "msg" + (isError ? " err" : "");
    dashMsg.textContent = text || "";
  }

  if (!window.supabase || !cfg || !cfg.url || !cfg.publishableKey) {
    showLogin("Admin is unavailable: the Supabase settings did not load.");
    return;
  }

  client = window.supabase.createClient(cfg.url, cfg.publishableKey, {
    auth: { storageKey: "safebuy-admin-auth" }
  });

  /* ---------- Sign in ---------- */
  async function enter() {
    var r = await client.rpc("is_admin");
    if (r.error) {
      await client.auth.signOut();
      showLogin("Admin check failed: " + r.error.message + " (run schema.sql in Supabase first).");
      return;
    }
    if (r.data !== true) {
      await client.auth.signOut();
      showLogin("This account does not have admin access.");
      return;
    }
    var u = await client.auth.getUser();
    document.getElementById("who").textContent = u.data && u.data.user ? u.data.user.email : "";
    showDash();
    syncTabs();
    startLive();
    client.rpc("expire_verifications").then(function () { fetchAll(); }, function () { fetchAll(); });
  }

  document.getElementById("login-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    var btn = document.getElementById("login-btn");
    btn.disabled = true;
    loginMsg.className = "msg";
    loginMsg.textContent = "Signing in…";
    var res = await client.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });
    btn.disabled = false;
    if (res.error) { showLogin("Incorrect email or password."); return; }
    document.getElementById("password").value = "";
    await enter();
  });

  document.getElementById("logout-btn").addEventListener("click", async function () {
    stopLive();
    await client.auth.signOut();
    apps = []; prods = []; known = null;
    list.innerHTML = "";
    showLogin("");
  });

  document.getElementById("refresh-btn").addEventListener("click", function () { fetchAll(true); });

  /* ---------- Live updates ---------- */
  function setLive(state, text) {
    liveDot.className = "dot " + state;
    liveText.textContent = text;
  }

  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function () { fetchAll(); }, 500);
  }

  function startLive() {
    stopLive();
    setLive("", "Connecting…");
    try {
      channel = client.channel("admin-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "seller_applications" }, scheduleRefresh)
        .on("postgres_changes", { event: "*", schema: "public", table: "seller_products" }, scheduleRefresh)
        .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, scheduleRefresh)
        .on("postgres_changes", { event: "*", schema: "public", table: "verification_requests" }, scheduleRefresh)
        .subscribe(function (status) {
          realtimeOk = status === "SUBSCRIBED";
          if (realtimeOk) setLive("on", "Live");
          else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setLive("off", "Auto-refresh");
        });
    } catch (e) {
      setLive("off", "Auto-refresh");
    }
    // Safety net: refresh every 30 s while the tab is visible, even if realtime is off.
    pollTimer = setInterval(function () {
      if (!document.hidden) fetchAll();
    }, 30000);
  }

  function stopLive() {
    clearInterval(pollTimer);
    clearTimeout(refreshTimer);
    pollTimer = null;
    if (channel) { try { client.removeChannel(channel); } catch (e) {} channel = null; }
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && !dashView.hidden) fetchAll();
  });

  /* ---------- Data ---------- */
  async function fetchAll(manual) {
    if (manual) { liveText.textContent = "Refreshing…"; }
    var results = await Promise.all([
      client.from("seller_applications").select("*").order("created_at", { ascending: false }),
      client.from("seller_products").select("*").order("created_at", { ascending: false }),
      client.from("leads").select("*").order("created_at", { ascending: false }),
      client.from("verification_requests").select("*").order("created_at", { ascending: false })
    ]);
    var ar = results[0], pr = results[1], lr = results[2], vr = results[3];
    if (ar.error || pr.error) {
      note((ar.error || pr.error).message, true);
      setLive("off", "Update failed");
      return;
    }

    // mark rows that were not here on the previous fetch
    var fresh = {};
    var now = {};
    ar.data.forEach(function (a) { now["a" + a.id] = 1; });
    pr.data.forEach(function (p) { now["p" + p.id] = 1; });
    (lr.error ? [] : lr.data).forEach(function (l) { now["l" + l.id] = 1; });
    (vr.error ? [] : vr.data).forEach(function (v) { now["v" + v.id] = 1; });
    if (known) { Object.keys(now).forEach(function (k) { if (!known[k]) fresh[k] = 1; }); }
    known = now;

    apps = ar.data;
    prods = pr.data;
    leadRows = lr.error ? [] : lr.data;
    leadsErr = lr.error ? lr.error.message : "";
    vrRows = vr.error ? [] : vr.data;
    vrErr = vr.error ? vr.error.message : "";
    lastUpdated = new Date();
    if (realtimeOk) setLive("on", "Live · " + lastUpdated.toLocaleTimeString("en-NG", { hour: "2-digit", minute: "2-digit" }));
    else setLive("off", "Updated " + lastUpdated.toLocaleTimeString("en-NG", { hour: "2-digit", minute: "2-digit" }));

    renderAll(fresh);
  }

  /* ---------- Rendering ---------- */
  function shopMap() {
    var m = {};
    apps.forEach(function (a) { m[a.id] = a.shop_name; });
    return m;
  }

  function appCounts() {
    var c = { pending: 0, approved: 0, rejected: 0, all: apps.length };
    apps.forEach(function (a) { if (c[a.verification_status] != null) c[a.verification_status]++; });
    return c;
  }
  function prodCounts() {
    var c = { all: prods.length, published: 0, hidden: 0, soldout: 0 };
    prods.forEach(function (p) {
      if (p.status === "published") c.published++;
      if (p.status === "hidden") c.hidden++;
      if (p.in_stock === false) c.soldout++;
    });
    return c;
  }

  function leadCounts() {
    var c = { all: leadRows.length, email: 0, phone: 0 };
    leadRows.forEach(function (l) { if (l.email) c.email++; if (l.phone) c.phone++; });
    return c;
  }

  function renderStats() {
    var a = appCounts(), p = prodCounts();
    var cards = [
      { label: "Shops", value: a.all, go: ["applications", "all"] },
      { label: "Need verifying", value: a.pending, go: ["applications", "pending"], alert: a.pending > 0 },
      { label: "Live products", value: p.published, go: ["products", "published"] },
      { label: "Sold out", value: p.soldout, go: ["products", "soldout"] },
      { label: "Leads", value: leadRows.length, go: ["leads", "all"] },
      { label: "Verification requests", value: vCounts().open, go: ["verify", "open"], alert: vCounts().open > 0 }
    ];
    statsBox.innerHTML = cards.map(function (c) {
      return '<button type="button" class="stat' + (c.alert ? " alert" : "") + '" data-go="' + c.go.join("|") + '">' +
        "<b>" + c.value + "</b><span>" + esc(c.label) + "</span></button>";
    }).join("");
  }

  function renderTabs() {
    var a = appCounts(), p = prodCounts();
    var cs = document.getElementById("c-sellers");
    cs.textContent = a.all;
    cs.className = "count" + (a.pending > 0 ? " hot" : "");
    document.getElementById("c-products").textContent = p.all;
    document.getElementById("c-leads").textContent = leadRows.length;
    var cv = document.getElementById("c-verify");
    cv.textContent = vCounts().open;
    cv.className = "count" + (vCounts().open > 0 ? " hot" : "");

    var counts = tab === "applications" ? a : tab === "leads" ? leadCounts() : tab === "verify" ? vCounts() : p;
    filterTabs.innerHTML = FILTERS[tab].map(function (f) {
      var on = filters[tab] === f[0];
      var hot = tab === "applications" && f[0] === "pending" && counts.pending > 0 && !on;
      return '<button class="tab' + (on ? " active" : "") + '" type="button" data-filter="' + f[0] + '">' +
        esc(f[1]) + ' <span class="count' + (hot ? " hot" : "") + '">' + (counts[f[0]] || 0) + "</span></button>";
    }).join("");
  }

  function syncTabs() {
    document.querySelectorAll("[data-tab]").forEach(function (x) {
      x.classList.toggle("active", x.dataset.tab === tab);
    });
    searchBox.placeholder = tab === "applications" ? "Search shops by name, phone, state…"
      : tab === "leads" ? "Search leads by email or phone…"
      : tab === "verify" ? "Search by shop, RC/TIN, payment reference or badge…" : "Search products by name, category, shop…";
  }

  function sortRows(rows, nameKey) {
    var mode = sortBox.value;
    var out = rows.slice();
    if (mode === "oldest") out.sort(function (x, y) { return new Date(x.created_at) - new Date(y.created_at); });
    else if (mode === "name") out.sort(function (x, y) { return String(x[nameKey] || "").localeCompare(String(y[nameKey] || "")); });
    else out.sort(function (x, y) { return new Date(y.created_at) - new Date(x.created_at); });
    return out;
  }

  function renderAll(fresh) {
    renderStats();
    renderTabs();
    if (tab === "applications") renderApplications(fresh || {});
    else if (tab === "leads") renderLeads(fresh || {});
    else if (tab === "verify") renderVerify(fresh || {});
    else renderProducts(fresh || {});
  }

  function renderApplications(fresh) {
    var term = searchBox.value.trim().toLowerCase();
    var f = filters.applications;
    var rows = apps.filter(function (a) {
      if (f !== "all" && a.verification_status !== f) return false;
      if (!term) return true;
      return [a.shop_name, a.slug, a.phone, a.state, a.main_category, a.instagram_handle]
        .join(" ").toLowerCase().indexOf(term) !== -1;
    });
    rows = sortRows(rows, "shop_name");

    if (!rows.length) {
      list.innerHTML = '<div class="empty">' + (term ? "No shops match your search." : "No shops in this view.") + "</div>";
      return;
    }

    var listed = {};
    prods.forEach(function (p) {
      var o = listed[p.seller_application_id] || (listed[p.seller_application_id] = { total: 0, live: 0 });
      o.total++;
      if (p.status === "published") o.live++;
    });

    list.innerHTML = rows.map(function (a) {
      var s = a.verification_status;
      var n = listed[a.id] || { total: 0, live: 0 };
      return '<div class="item' + (fresh["a" + a.id] ? " fresh" : "") + '">' +
        '<span class="pill ' + esc(s) + '">' + esc(STATUS_LABEL[s] || s) + "</span> " +
        "<strong>" + esc(a.shop_name) + "</strong> <span class=\"muted\">(" + esc(a.slug) + ")</span><br>" +
        "Phone: " + esc(a.phone) + " · State: " + esc(a.state || "-") + "<br>" +
        "Category: " + esc(a.main_category || "-") + " · Instagram: " + esc(a.instagram_handle || "-") + "<br>" +
        "Address: " + esc(a.business_address || a.pickup_address || "-") + "<br>" +
        "Products: " + n.total + " (" + n.live + " live)<br>" +
        '<span class="muted">Applied ' + esc(new Date(a.created_at).toLocaleString("en-NG")) + "</span>" +
        '<div class="actions">' +
        (s !== "approved" ? '<button class="button" type="button" data-review="approved" data-id="' + esc(a.id) + '">Verify shop</button>' : "") +
        (s !== "rejected" ? '<button class="button danger" type="button" data-review="rejected" data-id="' + esc(a.id) + '">Suspend shop</button>' : "") +
        (s !== "pending" ? '<button class="button outline" type="button" data-review="pending" data-id="' + esc(a.id) + '">' + (s === "rejected" ? "Reinstate (unverified)" : "Remove verification") + "</button>" : "") +
        '<button class="button outline" type="button" data-acat="1" data-id="' + esc(a.id) + '" data-cat="' + esc(a.main_category || "") + '">Edit category</button>' +
        "</div></div>";
    }).join("");
  }

  function renderProducts(fresh) {
    var term = searchBox.value.trim().toLowerCase();
    var f = filters.products;
    var shops = shopMap();
    var rows = prods.filter(function (p) {
      if (f === "published" && p.status !== "published") return false;
      if (f === "hidden" && p.status !== "hidden") return false;
      if (f === "soldout" && p.in_stock !== false) return false;
      if (!term) return true;
      return [p.name, p.category, shops[p.seller_application_id]].join(" ").toLowerCase().indexOf(term) !== -1;
    });
    rows = sortRows(rows, "name");

    if (!rows.length) {
      list.innerHTML = '<div class="empty">' + (term ? "No products match your search." : "No products in this view.") + "</div>";
      return;
    }

    list.innerHTML = rows.map(function (p) {
      var live = p.status === "published";
      return '<div class="item' + (fresh["p" + p.id] ? " fresh" : "") + '"><div class="row">' +
        (p.image_url && /^https:\/\//.test(p.image_url) ? '<img class="thumb" src="' + esc(p.image_url) + '" alt="">' : '<div class="thumb"></div>') +
        '<div class="grow"><span class="pill ' + esc(p.status) + '">' + esc(STATUS_LABEL[p.status] || p.status) + "</span>" + (p.in_stock === false ? ' <span class="pill">Sold out</span>' : "") + " " +
        "<strong>" + esc(p.name) + "</strong><br>" +
        money(p.price_kobo) + " · " + esc(p.category) + "<br>" +
        '<span class="muted">Shop: ' + esc(shops[p.seller_application_id] || "unknown") + "</span>" +
        '<div class="actions">' +
        '<button class="button ' + (live ? "outline" : "") + '" type="button" data-pstatus="' + (live ? "hidden" : "published") + '" data-id="' + esc(p.id) + '">' + (live ? "Unpublish" : "Publish") + "</button>" +
        '<button class="button outline" type="button" data-pcat="1" data-id="' + esc(p.id) + '" data-cat="' + esc(p.category || "") + '">Edit category</button>' +
        '<button class="button danger" type="button" data-pdel="' + esc(p.id) + '" data-path="' + esc(p.image_path || "") + '">Delete</button>' +
        "</div></div></div></div>";
    }).join("");
  }

  /* ---------- Lead generation ---------- */
  function visibleLeads() {
    var term = searchBox.value.trim().toLowerCase();
    var f = filters.leads;
    var rows = leadRows.filter(function (l) {
      if (f === "email" && !l.email) return false;
      if (f === "phone" && !l.phone) return false;
      if (!term) return true;
      return [l.email, l.phone, l.source].join(" ").toLowerCase().indexOf(term) !== -1;
    });
    return sortRows(rows, "email");
  }

  function renderLeads(fresh) {
    if (leadsErr) {
      list.innerHTML = '<div class="empty">Could not load leads: ' + esc(leadsErr) + "<br>Run leads.sql in Supabase first.</div>";
      return;
    }
    var rows = visibleLeads();
    var bar = '<div class="leads-bar"><span class="muted">' + rows.length + " lead" + (rows.length === 1 ? "" : "s") +
      '</span><button class="button light" type="button" data-export="1"' + (rows.length ? "" : " disabled") + ">Export CSV</button></div>";
    if (!rows.length) {
      list.innerHTML = bar + '<div class="empty">' + (searchBox.value.trim() ? "No leads match your search." : "No leads yet. They appear here when visitors sign up on the shop.") + "</div>";
      return;
    }
    list.innerHTML = bar + '<div class="table-wrap"><table><thead><tr><th>#</th><th>Email</th><th>Phone</th><th>Source</th><th>Date</th><th></th></tr></thead><tbody>' +
      rows.map(function (l, i) {
        return '<tr class="' + (fresh["l" + l.id] ? "fresh" : "") + '"><td>' + (i + 1) + "</td>" +
          "<td>" + esc(l.email || "-") + "</td><td>" + esc(l.phone || "-") + "</td><td>" + esc(l.source || "-") + "</td>" +
          "<td>" + esc(new Date(l.created_at).toLocaleString("en-NG")) + "</td>" +
          '<td><button class="button danger" type="button" data-ldel="' + esc(l.id) + '">Delete</button></td></tr>';
      }).join("") + "</tbody></table></div>";
  }

  function csvCell(v) {
    v = String(v == null ? "" : v);
    if (/^[=\-@]/.test(v) || (/^\+/.test(v) && !/^\+[0-9]+$/.test(v))) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  }

  function exportLeads() {
    var rows = visibleLeads();
    var lines = [["Email", "Phone", "Source", "Date"].map(csvCell).join(",")];
    rows.forEach(function (l) {
      lines.push([l.email, l.phone, l.source, new Date(l.created_at).toISOString()].map(csvCell).join(","));
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "safebuy-leads-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ---------- Verification requests ---------- */
  var V_LABEL = { submitted: "Awaiting payment check", paid: "Paid · ready to review", approved: "Approved", rejected: "Rejected", expired: "Expired" };
  var V_PILL = { submitted: "", paid: "", approved: "approved", rejected: "rejected", expired: "hidden" };

  function vCounts() {
    var c = { open: 0, approved: 0, rejected: 0, expired: 0, all: vrRows.length };
    vrRows.forEach(function (v) {
      if (v.status === "submitted" || v.status === "paid") c.open++;
      else if (c[v.status] != null) c[v.status]++;
    });
    return c;
  }

  function renderVerify(fresh) {
    if (vrErr) {
      list.innerHTML = '<div class="empty">Could not load verification requests: ' + esc(vrErr) + "<br>Run verification.sql in Supabase first.</div>";
      return;
    }
    var term = searchBox.value.trim().toLowerCase();
    var f = filters.verify;
    var shops = shopMap();
    var rows = vrRows.filter(function (v) {
      if (f === "open" && v.status !== "submitted" && v.status !== "paid") return false;
      if (f !== "open" && f !== "all" && v.status !== f) return false;
      if (!term) return true;
      return [shops[v.seller_application_id], v.id_number, v.payment_reference, v.badge_number]
        .join(" ").toLowerCase().indexOf(term) !== -1;
    });
    rows = sortRows(rows, "id_number");

    if (!rows.length) {
      list.innerHTML = '<div class="empty">' + (term ? "No requests match your search." : "No requests in this view.") + "</div>";
      return;
    }

    list.innerHTML = rows.map(function (v) {
      var open = v.status === "submitted" || v.status === "paid";
      return '<div class="item' + (fresh["v" + v.id] ? " fresh" : "") + '">' +
        '<span class="pill ' + V_PILL[v.status] + '">' + esc(V_LABEL[v.status] || v.status) + "</span> " +
        "<strong>" + esc(shops[v.seller_application_id] || "Unknown shop") + "</strong><br>" +
        esc(v.id_type) + " number: <strong>" + esc(v.id_number) + "</strong><br>" +
        "Payment: " + money(v.amount_kobo) + " · Reference: " + esc(v.payment_reference) + "<br>" +
        (v.badge_number ? "Badge number: <strong>" + esc(v.badge_number) + "</strong>" +
          (v.expires_at ? " · Valid until " + esc(new Date(v.expires_at).toLocaleDateString("en-NG")) : "") + "<br>" : "") +
        (v.admin_note ? "Note: " + esc(v.admin_note) + "<br>" : "") +
        '<span class="muted">Submitted ' + esc(new Date(v.created_at).toLocaleString("en-NG")) + "</span>" +
        (open ? '<div class="actions">' +
          (v.status === "submitted" ? '<button class="button" type="button" data-vpay="' + esc(v.id) + '">Confirm payment received</button>' : "") +
          (v.status === "paid" ? '<button class="button" type="button" data-vapprove="' + esc(v.id) + '">Approve and issue badge</button>' : "") +
          '<button class="button danger" type="button" data-vreject="' + esc(v.id) + '">Reject</button></div>' : "") +
        "</div>";
    }).join("");
  }

  /* ---------- Navigation: tabs, filters, search, sort, stat cards ---------- */
  function switchTab(next, filter) {
    tab = next;
    if (filter) filters[tab] = filter;
    searchBox.value = "";
    note("");
    saveView();
    syncTabs();
    renderAll();
  }

  document.getElementById("main-tabs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-tab]");
    if (b) switchTab(b.dataset.tab);
  });
  filterTabs.addEventListener("click", function (e) {
    var b = e.target.closest("[data-filter]");
    if (!b) return;
    filters[tab] = b.dataset.filter;
    saveView();
    renderAll();
  });
  statsBox.addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (!b) return;
    var p = b.dataset.go.split("|");
    switchTab(p[0], p[1]);
  });
  searchBox.addEventListener("input", function () { renderAll(); });
  sortBox.addEventListener("change", function () { renderAll(); });

  /* ---------- Actions ---------- */
  list.addEventListener("click", async function (event) {
    var b = event.target.closest("button");
    if (!b) return;
    b.disabled = true;
    note("");

    if (b.dataset.export) { exportLeads(); b.disabled = false; return; }

    if (b.dataset.vpay) {
      var vp = await client.from("verification_requests")
        .update({ status: "paid", paid_at: new Date().toISOString() })
        .eq("id", b.dataset.vpay).eq("status", "submitted").select("id");
      if (vp.error || !vp.data || !vp.data.length) {
        note(vp.error ? vp.error.message : "The change was not saved.", true);
        b.disabled = false;
        return;
      }
      fetchAll();
      return;
    }

    if (b.dataset.vapprove) {
      if (!window.confirm("Check the number on the official register first. Approve and issue the badge?")) { b.disabled = false; return; }
      var ap = await client.rpc("admin_approve_verification", { p_request: b.dataset.vapprove });
      if (ap.error) { note(ap.error.message, true); b.disabled = false; return; }
      await fetchAll();
      note("Verified. Badge number " + ap.data + " issued.");
      return;
    }

    if (b.dataset.vreject) {
      var why = window.prompt("Reason for rejecting (the seller will see this):", "");
      if (why === null) { b.disabled = false; return; }
      var rj = await client.from("verification_requests")
        .update({ status: "rejected", admin_note: why.trim() || null, reviewed_at: new Date().toISOString() })
        .eq("id", b.dataset.vreject).in("status", ["submitted", "paid"]).select("id");
      if (rj.error || !rj.data || !rj.data.length) {
        note(rj.error ? rj.error.message : "The change was not saved.", true);
        b.disabled = false;
        return;
      }
      fetchAll();
      return;
    }

    if (b.dataset.ldel) {
      if (!window.confirm("Delete this lead permanently?")) { b.disabled = false; return; }
      var ld = await client.from("leads").delete().eq("id", b.dataset.ldel).select("id");
      if (ld.error || !ld.data || !ld.data.length) {
        note(ld.error ? ld.error.message : "The lead was not deleted.", true);
        b.disabled = false;
        return;
      }
      fetchAll();
      return;
    }

    if (b.dataset.acat || b.dataset.pcat) {
      var isShop = !!b.dataset.acat;
      var entered = window.prompt(
        "New category (2 to 40 letters or numbers). Built-in: " + BUILTIN_CATS.join(", "),
        b.dataset.cat || ""
      );
      if (entered === null) { b.disabled = false; return; }
      var cat = normCat(entered);
      if (!/^[A-Za-z0-9][A-Za-z0-9 &\/-]{1,39}$/.test(cat)) {
        note("Invalid category. Use 2 to 40 letters or numbers (spaces, &, / and - are allowed).", true);
        b.disabled = false;
        return;
      }
      var cu = isShop
        ? await client.from("seller_applications").update({ main_category: cat, updated_at: new Date().toISOString() }).eq("id", b.dataset.id).select("id")
        : await client.from("seller_products").update({ category: cat, updated_at: new Date().toISOString() }).eq("id", b.dataset.id).select("id");
      if (cu.error || !cu.data || !cu.data.length) {
        note(cu.error ? cu.error.message : "The change was not saved. Run admin_patch.sql first.", true);
        b.disabled = false;
        return;
      }
      await fetchAll();
      note("Category changed to “" + cat + "”.");
      return;
    }

    if (b.dataset.review) {
      var u = await client.from("seller_applications")
        .update({ verification_status: b.dataset.review, updated_at: new Date().toISOString() })
        .eq("id", b.dataset.id).select("id");
      if (u.error || !u.data || !u.data.length) {
        note(u.error ? u.error.message : "The change was not saved.", true);
        b.disabled = false;
        return;
      }
      fetchAll();
      return;
    }

    if (b.dataset.pstatus) {
      var s = await client.from("seller_products")
        .update({ status: b.dataset.pstatus }).eq("id", b.dataset.id).select("id");
      if (s.error || !s.data || !s.data.length) {
        note(s.error ? s.error.message : "The change was not saved. Run admin_patch.sql first.", true);
        b.disabled = false;
        return;
      }
      fetchAll();
      return;
    }

    if (b.dataset.pdel) {
      if (!window.confirm("Delete this product permanently?")) { b.disabled = false; return; }
      var d = await client.from("seller_products").delete().eq("id", b.dataset.pdel).select("id");
      if (d.error || !d.data || !d.data.length) {
        note(d.error ? d.error.message : "The product was not deleted.", true);
        b.disabled = false;
        return;
      }
      if (b.dataset.path) await client.storage.from("product-images").remove([b.dataset.path]);
      fetchAll();
    }
  });

  /* ---------- Start ---------- */
  client.auth.getSession().then(function (r) {
    if (r.data && r.data.session) enter(); else showLogin("");
  });
})();
</script>
</body>
</html>
