<script src="/safebuy.com/supabase-config.js"></script>
<script>
(function(){
  var app=document.getElementById("app");
  var m=location.pathname.match(/^(.*\/)p\/([a-z0-9-]+)\/?$/);
  var base=m?m[1]:"/safebuy.com/";
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function notFound(){document.title="Not found | SafeBuy NG";app.innerHTML='<h1>Page not found</h1><p><a href="'+base+'">← Back to SafeBuy NG</a></p>';}
  var c=window.SAFEbuySupabaseConfig;
  if(!m||!c){notFound();return;}
  var slug=m[2], h={apikey:c.publishableKey,Authorization:"Bearer "+c.publishableKey};
  var gal=document.getElementById("gal"),strip=document.getElementById("strip"),cnt=document.getElementById("gcount");
  var galBound=false;

  function render(p,urls){
    var price="₦"+Number(p.price).toLocaleString("en-NG"), out=p.inStock===false;
    document.title=p.name+" | SafeBuy NG";
    app.innerHTML='<a href="'+base+'">← SafeBuy NG</a>'+
      (urls.length?'<div class="hero" id="hero"><img src="'+esc(urls[0])+'" alt="'+esc(p.name)+'">'+(urls.length>1?'<span class="more">+'+(urls.length-1)+' photos</span>':'')+'</div>':'')+
      '<h1>'+esc(p.name)+'</h1><h2>'+price+'</h2>'+
      '<p>'+esc(p.seller)+' · '+(p.verified?'✓ Verified':'Unverified')+' · '+esc(p.category)+' · '+(out?'Sold out':'In stock')+'</p>'+
      '<p>'+esc(p.description)+'</p>'+
      '<button class="btn" id="chat" type="button"'+(out?' disabled':'')+'>'+(out?'Sold out':'Chat seller on WhatsApp')+'</button>'+
      '<p class="note">SafeBuy NG does not handle payments or delivery yet. Meet in a public place and inspect the item before you pay.</p>';
    strip.innerHTML=urls.map(function(u){return '<img src="'+esc(u)+'" alt="">';}).join("");
    var hero=document.getElementById("hero");
    if(hero) hero.addEventListener("click",function(){gal.classList.add("open");strip.scrollLeft=0;cnt.textContent="1 / "+urls.length;});
    if(!galBound){
      galBound=true;
      strip.addEventListener("scroll",function(){cnt.textContent=(Math.round(strip.scrollLeft/strip.clientWidth)+1)+" / "+strip.children.length;});
      document.getElementById("gclose").addEventListener("click",function(){gal.classList.remove("open");});
    }
    document.getElementById("chat").addEventListener("click",function(){chat(p,price,this);});
  }

  function wa(phone){var x=String(phone||"").replace(/\D/g,"");if(x.indexOf("234")===0)return x;if(x.charAt(0)==="0")return "234"+x.slice(1);if(x.length===10)return "234"+x;return x;}
  function chat(p,price,btn){
    btn.disabled=true;
    fetch(c.url+"/rest/v1/rpc/seller_contact",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},h),body:JSON.stringify({p_product:p.id})})
      .then(function(r){return r.json().then(function(d){if(!r.ok) throw 0;return d;});})
      .then(function(d){var n=wa(d);if(!n) throw 0;
        location.href="https://wa.me/"+n+"?text="+encodeURIComponent('Hello, I\'m interested in "'+p.name+'" ('+price+') on SafeBuy NG. Is it still available?');})
      .catch(function(){alert("This seller's contact is not available right now.");btn.disabled=false;});
  }

  // 1. Instant paint from saved data
  var K="sb_page_"+slug, saved=null, fromList=null;
  try{saved=JSON.parse(localStorage.getItem(K)||"null");}catch(e){}
  try{fromList=(JSON.parse(localStorage.getItem("sb_products_v1")||"[]")).filter(function(x){return x.slug===slug;})[0];}catch(e){}
  if(saved) render(saved.p,saved.urls);
  else if(fromList) render(fromList,fromList.image?[fromList.image]:[]);
  else app.innerHTML="<p>Loading…</p>";

  // 2. Fresh data, product and photos fetched in parallel
  var pid=(saved&&saved.p.id)||(fromList&&fromList.id);
  var prodReq=fetch(c.url+"/rest/v1/seller_products_public?select=*&slug=eq."+encodeURIComponent(slug),{headers:h}).then(function(r){return r.json();});
  var imgReq=pid?fetch(c.url+"/rest/v1/product_images?select=image_url,position&product_id=eq."+encodeURIComponent(pid)+"&order=position.asc",{headers:h}).then(function(r){return r.json();}):null;
  prodReq.then(function(d){
    var r=Array.isArray(d)?d[0]:null;
    if(!r){ if(!saved&&!fromList) notFound(); return; }
    var p={id:r.id,name:r.name,category:r.category,price:Number(r.price_kobo)/100,seller:r.shop_name,description:r.description,verified:r.verified,inStock:r.in_stock};
    return (imgReq||fetch(c.url+"/rest/v1/product_images?select=image_url,position&product_id=eq."+encodeURIComponent(p.id)+"&order=position.asc",{headers:h}).then(function(x){return x.json();}))
      .catch(function(){return [];}).then(function(rows){
        var urls=[]; if(/^https:\/\//.test(r.image_url||"")) urls.push(r.image_url);
        (Array.isArray(rows)?rows:[]).forEach(function(x){if(x.image_url&&/^https:\/\//.test(x.image_url)&&urls.indexOf(x.image_url)<0) urls.push(x.image_url);});
        try{localStorage.setItem(K,JSON.stringify({p:p,urls:urls}));}catch(e){}
        if(!gal.classList.contains("open")) render(p,urls);
      });
  }).catch(function(){ if(!saved&&!fromList) notFound(); });
})();
</script>
