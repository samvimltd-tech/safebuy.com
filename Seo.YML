name: Build SEO files

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site.config.json"
      - ".github/workflows/seo.yml"

permissions:
  contents: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate product pages, sitemap and feed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-seo.mjs

      - name: Commit changes
        run: | git config user.name "safebuy-seo-bot" git config user.email "safebuy-seo-bot@users.noreply.github.com" git add -A p sitemap.xml robots.txt feed index.html if git diff --cached --quiet; then echo "No changes to publish." else git commit -m "Update SEO pages, sitemap and feed" git push fi
