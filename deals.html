<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeBuy NG Deals</title>
<meta name="description" content="Today's shared deals from sellers on SafeBuy NG. Real products, real shops, naira prices.">
<meta name="theme-color" content="#087f5b">
<style>
:root{--g:#087f5b;--ink:#16231d;--mut:#52675c;--bg:#f5f8f6;--line:#dfe8e3}
*{box-sizing:border-box}body{margin:0;font:18px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--g);color:#fff;padding:18px 16px}header a{color:#fff;text-decoration:none;font-weight:800;font-size:22px}
main{max-width:980px;margin:0 auto;padding:16px}h1{font-size:28px;margin:8px 0 4px}h2{font-size:24px;margin:26px 0 4px}
.sub{color:var(--mut);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.c{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit}
.c img{width:100%;aspect-ratio:1;object-fit:cover;background:#e8efeb;display:block}.c div{padding:10px 12px}
.c b{display:block;font-size:17px;line-height:1.3}.c span{display:block;color:var(--mut);font-size:15px}.c em{font-style:normal;font-weight:800;color:var(--g);font-size:19px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mut)}
.note{font-size:14px;color:var(--mut);margin-top:24px}
</style></head><body>
<header><a href="./">SafeBuy NG</a></header>
<main><h1>Deals from SafeBuy sellers</h1><p class="sub">Products chosen and checked by SafeBuy NG. Tap a product to see the seller and buy safely.</p><div id="out"><p class="sub">Loading…</p></div>
<p class="note">Every product here was submitted by its seller and approved by SafeBuy NG. Prices and stock can change, so check the product page before you pay.</p></main>
<script src="./supabase-config.js"></script>
<script>
(function(){"use strict";
var cfg=window.SAFEbuySupabaseConfig,out=document.getElementById("out");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function naira(k){return"₦"+(Number(k||0)/100).toLocaleString("en-NG")}
if(!cfg){out.innerHTML='<div class="empty">The page could not load. Please try again later.</div>';return}
var base=String(cfg.url).replace(/\/+$/,"");
function rpc(n,a,keep){return fetch(base+"/rest/v1/rpc/"+n,{method:"POST",keepalive:!!keep,headers:{apikey:cfg.publishableKey,Authorization:"Bearer "+cfg.publishableKey,"Content-Type":"application/json"},body:JSON.stringify(a||{})}).then(function(r){return r.ok?r.json():Promise.reject(new Error("load"))})}
var q=new URLSearchParams(location.search),want=q.get("c"),src=(q.get("src")||"site").replace(/[^a-z0-9_]/gi,"").slice(0,20)||"site";
var seen={};
function track(c,p,k){try{rpc("consol_track",{p_campaign:c,p_product:p,p_channel:src,p_kind:k},true).catch(function(){})}catch(e){}}
rpc("consol_public",want&&/^[0-9a-f-]{36}$/i.test(want)?{p_campaign:want}:{}).then(function(list){
  list=(list||[]).filter(function(c){return c.products&&c.products.length});
  if(!list.length){out.innerHTML='<div class="empty"><b>No deals running right now.</b><br>New campaigns start every day. Please check back soon.</div>';return}
  out.innerHTML=list.map(function(c){return'<h2>'+esc(c.name)+'</h2><p class="sub">'+c.products.length+' products from SafeBuy sellers</p><div class="grid">'+c.products.map(function(p){
    var href="./p/"+encodeURIComponent(p.slug||"")+"/?src="+encodeURIComponent("ad-"+c.id.slice(0,8)+"-"+src);
    return'<a class="c" href="'+href+'" data-c="'+esc(c.id)+'" data-p="'+esc(p.id)+'">'+(p.image?'<img loading="lazy" referrerpolicy="no-referrer" src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<img alt="">')+'<div><b>'+esc(p.name)+'</b><span>'+esc(p.shop||"")+'</span><em>'+naira(p.price_kobo)+'</em></div></a>'}).join("")+'</div>'}).join("");
  var items=out.querySelectorAll(".c");
  if("IntersectionObserver"in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var d=e.target.dataset;if(!seen[d.p]){seen[d.p]=1;track(d.c,d.p,"impression")}io.unobserve(e.target)}})},{threshold:.5});Array.prototype.forEach.call(items,function(i){io.observe(i)})}
  out.addEventListener("click",function(e){var a=e.target.closest(".c");if(a)track(a.dataset.c,a.dataset.p,"click")});
}).catch(function(){out.innerHTML='<div class="empty">Could not load the deals. Check your network and refresh.</div>'});
})();
</script></body></html>
