<title>SafeBuy Seller</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#14231c;--mute:#5d6f65;--line:#e4e9e5;--brand:#0b7a55;--brand2:#065f42;--soft:#e6f5ee;--warn:#b45309;--warnbg:#fff4e0;--bad:#b42318;--badbg:#fdecea;--ok:#067647;--okbg:#e3f6ec;--sh:0 1px 2px #0001,0 6px 18px #0000000d;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1612;--card:#16211b;--ink:#eaf2ed;--mute:#9bb0a4;--line:#26352c;--brand:#2fbf8a;--brand2:#1c9a6c;--soft:#173125;--warn:#f0b04a;--warnbg:#33260f;--bad:#ff8a7e;--badbg:#3a1815;--ok:#5fd59a;--okbg:#143324;--sh:0 1px 2px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--mute);font-size:14px}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .logo{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
header.top h1{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell{position:relative;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--card);font-size:19px}
.bell b{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font:700 11px/19px system-ui;padding:0 5px;text-align:center}
main{padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;border:0}
.hero .muted{color:#ffffffc4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--soft);color:var(--brand2)}
@media(prefers-color-scheme:dark){.btn{color:#04150d}.btn.alt{color:var(--brand)}}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--badbg);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1 1 130px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--brand2)}
.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ok{background:var(--okbg);color:var(--ok)}
@media(prefers-color-scheme:dark){.pill{color:var(--brand)}}
label{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:46px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}.chk input{width:22px;height:22px;min-height:0;flex:0 0 22px}
.msg{min-height:20px;margin:8px 0 0;font-size:14px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
@media(prefers-color-scheme:dark){.chip[aria-pressed=true]{color:#04150d}}
.ord h3{font-size:16px}
.ord .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.steps{display:flex;gap:4px;margin:10px 0 2px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--soft);flex:0 0 56px}
.prod{display:flex;gap:12px;align-items:center}
.prod .grow{flex:1;min-width:0}.prod strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;max-width:640px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.tabs button{flex:1;position:relative;border:0;background:transparent;padding:6px 2px;border-radius:12px;color:var(--mute);font-size:11px;font-weight:700;cursor:pointer}
nav.tabs button span{display:block;font-size:22px;line-height:1.2}
nav.tabs button[aria-current=page]{color:var(--brand)}
nav.tabs button b{position:absolute;top:2px;left:55%;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px system-ui;padding:0 4px}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:0 0 12px}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fd .22s ease-out both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90%;background:#14231c;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:200;box-shadow:var(--sh)}
.auth{max-width:420px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 20px 40px}
.auth .logo{width:60px;height:60px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 28px system-ui;margin:0 auto 14px}
.panel{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;padding:0 0 40px}
.panel .bar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
.panel .bar strong{flex:1;font-size:17px}
.panel .in{max-width:640px;margin:0 auto;padding:14px 16px}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.opt label{margin:0;font-weight:400}.opt input{position:absolute;opacity:0;pointer-events:none;width:0;min-height:0}.opt span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:99px;font-size:13px;cursor:pointer;background:var(--card)}.opt input:checked+span{background:var(--brand);border-color:var(--brand);color:#fff}.opt input:focus-visible+span{outline:2px solid var(--brand)}
.x{width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);color:var(--brand2);font-size:19px}
</style>

<body>

<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
/* ---- load the database library (our own copy first, then CDNs) and make ONE shared client ---- */
(function () {
  var ROOT = location.href.split("#")[0].split("?")[0].replace(/(seller|rider)\/(index\.html)?$/, "").replace(/index\.html$/, "");
  var SRC = [ROOT + "vendor/supabase-2.45.4.js", "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js", "https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"];
  var i = 0, ready = [];
  window.__sbWhenReady = function (f) { if (window.safeBuySupabase || window.__sbFailed) f(); else ready.push(f); };
  function done() { ready.splice(0).forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }
  function mk() {
    var cfg = window.SAFEbuySupabaseConfig;
    if (window.supabase && cfg && cfg.url && cfg.publishableKey) { try { window.safeBuySupabase = window.supabase.createClient(cfg.url, cfg.publishableKey); } catch (e) {} }
    if (!window.safeBuySupabase) window.__sbFailed = true;
    done();
  }
  function next() {
    if (window.supabase || i >= SRC.length) { mk(); return; }
    var s = document.createElement("script"); s.src = SRC[i++]; s.onload = next; s.onerror = next; document.head.appendChild(s);
  }
  next();
})();
</script>
<script>
(function () {
  "use strict";
  var C = null, USER = null, APP = null, TAB = "home";
  var ORDERS = [], PRODUCTS = [], ALERTS = [], FILTER = "new", EDIT = null, LOADED = {};
  var CATS = ["Electronics", "Fashion", "Home", "Beauty", "Groceries"], CATLAB = { Home: "Home & living" };
  var IMG = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp" }, MAXIMG = 5 * 1024 * 1024;
  var STATES = ["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"];
  var $ = function (id) { return document.getElementById(id); };
  var A = $("app");
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function naira(k) { return "₦" + (Number(k || 0) / 100).toLocaleString("en-NG", { maximumFractionDigits: 2 }); }
  function ago(iso) { var s = (Date.now() - new Date(iso)) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago"; if (s < 86400) return Math.floor(s / 3600) + " h ago"; return new Date(iso).toLocaleDateString("en-NG", { day: "numeric", month: "short" }); }
  var tt; function toast(t) { var e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(function () { e.hidden = true; }, 3200); }
  window.showToast = toast;
  function phone(v) { var d = String(v || "").replace(/[\s\-()]/g, ""); if (/^0\d{10}$/.test(d)) return "+234" + d.slice(1); if (/^234\d{10}$/.test(d)) return "+" + d; if (/^\+234\d{10}$/.test(d)) return d; return ""; }
  function setMsg(id, t, bad) { var m = $(id); if (m) { m.textContent = t || ""; m.className = "msg " + (bad ? "bad" : t ? "ok" : ""); } }
  function stateOpts(sel) { return STATES.map(function (s) { return '<option value="' + esc(s) + '"' + (String(sel || "").toLowerCase() === s.toLowerCase() ? " selected" : "") + ">" + esc(s) + "</option>"; }).join(""); }
  var COLORS = ["Red", "Black", "Blue", "White", "Green", "Yellow", "Brown", "Grey", "Pink", "Purple", "Orange"], SIZES = ["S", "M", "L", "XL", "XXL", "XXXL", "XXXXL", "1kg", "2kg", "5kg", "10kg", "25kg", "50kg"];
  function normCat(t) { t = String(t || "").replace(/\s+/g, " ").trim().toLowerCase().replace(/(^|[\s&\/-])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }); for (var i = 0; i < CATS.length; i++) if (CATS[i].toLowerCase() === t.toLowerCase()) return CATS[i]; if (t.toLowerCase() === "home & living") return "Home"; return t; }
  function chipGroup(g, list) { return '<div class="opt">' + list.map(function (v) { return '<label><input type="checkbox" data-g="' + g + '" value="' + esc(v) + '"><span>' + esc(v) + "</span></label>"; }).join("") + '<label><input type="checkbox" data-g="' + g + '" value="__other"><span>Other</span></label></div><input data-og="' + g + '" maxlength="80" placeholder="Other ' + g + ', separated by commas" hidden>'; }
  function readChips(g) { var out = []; A.querySelectorAll('input[type=checkbox][data-g="' + g + '"]:checked').forEach(function (c) { if (c.value !== "__other") out.push(c.value); }); var oc = A.querySelector('input[data-g="' + g + '"][value="__other"]'), ot = A.querySelector('input[data-og="' + g + '"]'); if (oc && oc.checked && ot) ot.value.split(",").forEach(function (x) { x = x.trim(); if (x && !out.some(function (y) { return y.toLowerCase() === x.toLowerCase(); })) out.push(x); }); return out; }
  function setChips(g, list) { var boxes = [].slice.call(A.querySelectorAll('input[type=checkbox][data-g="' + g + '"]')), others = []; boxes.forEach(function (c) { c.checked = false; }); (list || []).forEach(function (v) { var h = boxes.filter(function (c) { return c.value !== "__other" && c.value.toLowerCase() === String(v).toLowerCase(); })[0]; if (h) h.checked = true; else others.push(v); }); var oc = A.querySelector('input[data-g="' + g + '"][value="__other"]'), ot = A.querySelector('input[data-og="' + g + '"]'); if (oc) oc.checked = others.length > 0; if (ot) { ot.hidden = !others.length; ot.value = others.join(", "); } }
  function catOpts(sel) { return (sel ? "" : '<option value="" selected disabled>Select a category</option>') + CATS.map(function (c) { return '<option value="' + c + '"' + (c === sel ? " selected" : "") + ">" + esc(CATLAB[c] || c) + "</option>"; }).join(""); }
  function beep() { try { var X = window.AudioContext || window.webkitAudioContext, c = new X(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .18); setTimeout(function () { c.close(); }, 400); } catch (e) {} try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} }
  function friendly(e) { var m = (e && e.message) || String(e || ""); if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "No connection. Check your data and try again."; return m || "Something went wrong. Try again."; }

  /* =========================== AUTH =========================== */
  function authView(mode) {
    var up = mode === "up", fg = mode === "forgot";
    A.innerHTML = '<div class="auth fade"><div class="logo">S</div><h1 style="text-align:center">' + (fg ? "Reset password" : up ? "Open your seller account" : "Seller sign in") + '</h1>' +
      '<p class="muted" style="text-align:center;margin:6px 0 18px">This is the SafeBuy <b>Seller</b> app. It is separate from your buyer and rider accounts.</p>' +
      '<form id="af" class="card">' + (up ? '<label for="an">Your name</label><input id="an" autocomplete="name" required maxlength="80">' : "") +
      '<label for="ae">Email</label><input id="ae" type="email" autocomplete="email" inputmode="email" required>' +
      (fg ? "" : '<label for="ap">Password</label><input id="ap" type="password" autocomplete="' + (up ? "new-password" : "current-password") + '" required minlength="8">') +
      '<button class="btn full" style="margin-top:16px" id="ab">' + (fg ? "Send reset link" : up ? "Create seller account" : "Sign in") + '</button><p class="msg" id="am" role="status"></p></form>' +
      '<p style="text-align:center">' + (mode === "in" ? '<a href="#" data-m="forgot">Forgot password?</a><br><a href="#" data-m="up">New seller? Create an account</a>' : '<a href="#" data-m="in">Back to sign in</a>') + "</p></div>";
    A.querySelectorAll("[data-m]").forEach(function (a) { a.onclick = function (e) { e.preventDefault(); authView(a.dataset.m); }; });
    $("af").onsubmit = async function (e) {
      e.preventDefault(); var b = $("ab"); b.disabled = true; setMsg("am", "Please wait…");
      var em = $("ae").value.trim(), pw = $("ap") ? $("ap").value : "";
      try {
        var r;
        if (fg) { r = await C.auth.resetPasswordForEmail(em, { redirectTo: location.href.split("#")[0] }); if (r.error) throw r.error; setMsg("am", "Check your email for the reset link."); b.disabled = false; return; }
        if (up) { r = await C.auth.signUp({ email: em, password: pw, options: { data: { full_name: $("an").value.trim() } } }); if (r.error) throw r.error; if (!r.data.session) { setMsg("am", "Check your email to confirm, then sign in."); b.disabled = false; return; } }
        else { r = await C.auth.signInWithPassword({ email: em, password: pw }); if (r.error) throw r.error; }
        start();
      } catch (err) { setMsg("am", /Invalid login/i.test(err.message) ? "Wrong email or password." : friendly(err), true); b.disabled = false; }
    };
  }

  /* =========================== SETUP =========================== */
  function setupView() {
    A.innerHTML = '<div class="auth fade"><h1>Set up your shop</h1><p class="muted" style="margin:6px 0 14px">One step. Then add your first product.</p><form id="sf" class="card">' +
      '<label for="s1">Shop name</label><input id="s1" required maxlength="80">' +
      '<label for="s2">WhatsApp / phone number</label><input id="s2" type="tel" inputmode="tel" required placeholder="08012345678">' +
      '<label for="s3">State</label><select id="s3">' + stateOpts("Lagos") + '</select>' +
      '<label for="s7">Pickup address (shown on your product pages)</label><input id="s7" maxlength="300" placeholder="e.g. 6 Sampson Street, Upper Meniru, Enugu">' +
      '<label for="s4">Main category</label><select id="s4">' + catOpts("") + '</select>' +
      '<label for="s5">Instagram handle (optional)</label><input id="s5" placeholder="@yourshop">' +
      '<label class="chk" style="margin-top:14px"><input id="s6" type="checkbox" required><span>I agree that buyers can contact me on this number after an order is paid.</span></label>' +
      '<button class="btn full" style="margin-top:16px" id="sb">Create shop</button><p class="msg" id="sm"></p></form>' +
      '<p style="text-align:center"><a href="#" id="so">Sign out</a></p></div>';
    $("so").onclick = function (e) { e.preventDefault(); signOut(); };
    $("sf").onsubmit = async function (e) {
      e.preventDefault(); var b = $("sb"); b.disabled = true; setMsg("sm", "Creating your shop…");
      var shop = $("s1").value.trim();
      var row = { user_id: USER.id, shop_name: shop, slug: (shop.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "shop") + "-" + Math.random().toString(36).slice(2, 6), phone: $("s2").value.trim(), state: $("s3").value || null, main_category: $("s4").value || null, instagram_handle: $("s5").value.trim() || null, verification_status: "pending" };
      var r = await C.from("seller_applications").insert(row).select().single();
      if (r.error) { var m = r.error.message || ""; if (/phone_format/.test(m)) m = "Check your phone number, for example 08012345678."; setMsg("sm", m, true); b.disabled = false; return; }
      var pa = $("s7").value.trim(); if (pa) { try { await C.rpc("set_pickup_address", { p_address: pa }); } catch (x) {} }
      APP = r.data; toast("Shop created. Add your first product."); TAB = "products"; shell();

  }

  /* =========================== SHELL =========================== */
  function newCount() { return ORDERS.filter(function (o) { return o.status === "placed"; }).length; }
  function unreadCount() { return ALERTS.filter(function (n) { return !n.read_at; }).length; }
  function shell() {

      var up = await C.storage.from("product-images").upload(path, f, { contentType: f.type, upsert: false }); if (up.error) { toast("Upload failed: " + friendly(up.error)); continue; }
      var url = C.storage.from("product-images").getPublicUrl(path).data.publicUrl;
      var ins = await C.from("product_images").insert({ product_id: XT, image_path: path, image_url: url, position: pos++ }); if (ins.error) { C.storage.from("product-images").remove([path]); toast(friendly(ins.error)); continue; }
      done++;
    }
    if (done) toast(done + " photo" + (done === 1 ? "" : "s") + " added.");
  }
  async function prodAction(b) {
    var id = b.dataset.id, a = b.dataset.pa, p = PRODUCTS.filter(function (x) { return String(x.id) === String(id); })[0]; if (!p) return;
    if (a === "edit") { EDIT = id; draw(); window.scrollTo(0, 0); return; }
    if (a === "photos") { XT = id; var pk = $("xpick"); if (!pk) { pk = document.createElement("input"); pk.type = "file"; pk.multiple = true; pk.accept = "image/jpeg,image/png,image/webp"; pk.id = "xpick"; pk.hidden = true; pk.onchange = addExtra; document.body.appendChild(pk); } pk.value = ""; pk.click(); return; }
    if (a === "clearx") { if (!window.confirm("Remove all extra photos from this product? The main photo stays.")) return; var rx = await C.from("product_images").select("id,image_path").eq("product_id", id); var rows = rx.data || []; if (!rows.length) { toast("No extra photos to clear."); return; } await C.storage.from("product-images").remove(rows.map(function (x) { return x.image_path; })); var dx = await C.from("product_images").delete().eq("product_id", id); toast(dx.error ? friendly(dx.error) : "Extra photos removed."); return; }
    if (a === "del") { if (!window.confirm("Delete this product? This cannot be undone.")) return; b.disabled = true; var d = await C.from("seller_products").delete().eq("id", id).select("id"); if (d.error || !d.data || !d.data.length) { toast(d.error ? friendly(d.error) : "It could not be deleted."); b.disabled = false; return; } if (b.dataset.path) C.storage.from("product-images").remove([b.dataset.path]); toast("Product deleted."); }
    else { b.disabled = true; var ch = a === "stock" ? { in_stock: p.in_stock === false } : { status: p.status === "published" ? "hidden" : "published" }; var u = await C.from("seller_products").update(ch).eq("id", id).select("id"); if (u.error || !u.data || !u.data.length) { toast(u.error ? friendly(u.error) : "The change was not saved."); b.disabled = false; return; } toast("Updated."); }
    await loadProducts(); draw();
  }

  /* =========================== ACCOUNT / ALERTS =========================== */
  function vMe(m) {
    var v = APP.verification_status;
    m.innerHTML = '<div class="card fade"><h3>' + esc(APP.shop_name) + '</h3><p class="muted" style="margin:4px 0 8px">' + esc(USER.email) + '</p><span class="pill ' + (v === "approved" ? "ok" : v === "rejected" ? "bad" : "warn") + '">' + (v === "approved" ? "✓ Verified" : v === "rejected" ? "Suspended" : "Verification pending") + '</span></div>' +
      '<div class="card"><h3>📍 Pickup location</h3><p class="muted">' + (APP.dp_address ? esc(APP.dp_address + ", " + APP.dp_city + ", " + APP.dp_state) : "Not set yet") + '</p><button class="btn alt full" id="mp">' + (APP.dp_address ? "Change" : "Set pickup location") + '</button></div>' +
      '<div class="card"><h3>🏪 Shown on your product pages</h3><p class="muted" style="margin:4px 0 8px">Buyers see this address so they know where to collect.</p><input id="pa" maxlength="300" value="' + esc(APP.pickup_address || "") + '" placeholder="e.g. 6 Sampson Street, Enugu"><button class="btn alt full" style="margin-top:10px" id="pas">Save address</button><p class="msg" id="pam"></p></div>' +
      '<div class="card"><h3>Get verified</h3><p class="muted">Verified shops get a badge and more trust from buyers.</p><button class="btn alt full" id="mv">Open verification</button></div>' +
      '<div class="card"><h3>This account</h3><p class="muted">This is your <b>Seller</b> account. Buying uses the Buyer app and delivering uses the Rider app. Each is separate.</p><button class="btn line full" id="mo">Sign out</button></div>';
    $("pas").onclick = async function () { var r = await C.rpc("set_pickup_address", { p_address: $("pa").value.trim() }); if (r.error) setMsg("pam", friendly(r.error), true); else { APP.pickup_address = $("pa").value.trim(); setMsg("pam", "Address saved."); } };
    $("mp").onclick = pickupPanel; $("mo").onclick = signOut; $("mv").onclick = function () { if (window.__sbVerify && window.__sbVerify.open) window.__sbVerify.open(); else toast("Verification will open here soon. Contact SafeBuy NG support."); };
  }
  function panel(title, html) {
    closePanel(); var d = document.createElement("div"); d.id = "panel"; d.className = "panel";
    d.innerHTML = '<div class="bar"><strong>' + esc(title) + '</strong><button class="x" aria-label="Close">✕</button></div><div class="in">' + html + "</div>"; document.body.appendChild(d); d.querySelector(".x").onclick = closePanel; document.body.style.overflow = "hidden";
  }
  function closePanel() { var d = $("panel"); if (d) d.remove(); document.body.style.overflow = ""; }
  async function openAlerts() {
    await loadAlerts();
    panel("Alerts", ALERTS.length ? ALERTS.map(function (n) { return '<div class="card' + (n.read_at ? "" : '" style="border-color:var(--brand)') + '"><b>' + esc(n.title) + "</b>" + (n.body ? '<p class="muted" style="margin:4px 0 0">' + esc(n.body) + "</p>" : "") + '<div class="muted">' + ago(n.created_at) + "</div></div>"; }).join("") : '<div class="card"><p class="muted" style="margin:0">No alerts yet.</p></div>');
    if (unreadCount()) { var r = await C.rpc("mark_notifications_read_role", { p_role: "seller" }); if (r.error) await C.rpc("mark_notifications_read"); ALERTS.forEach(function (n) { n.read_at = n.read_at || new Date().toISOString(); }); var b = $("bell"); if (b && b.querySelector("b")) b.querySelector("b").remove(); }
  }

  /* =========================== BOOT =========================== */
  async function signOut() { try { await C.auth.signOut(); } catch (e) {} location.reload(); }
  var timer = null, chan = null;
  async function start() {
    var s = await C.auth.getSession(); USER = s.data && s.data.session ? s.data.session.user : null;
    if (!USER) { authView("in"); return; }
    A.innerHTML = '<main><div class="skel"></div><div class="skel"></div></main>';
    try { C.rpc("claim_role", { p_role: "seller" }).then(function () {}, function () {}); } catch (e) {}
    var r = await C.from("seller_applications").select("*").eq("user_id", USER.id).maybeSingle();
    if (r.error) { A.innerHTML = '<div class="auth"><div class="card"><h3>Could not open your shop</h3><p class="muted">' + esc(friendly(r.error)) + '</p><button class="btn full" onclick="location.reload()">Try again</button></div></div>'; return; }
    if (!r.data) { setupView(); return; }
    APP = r.data;
    if (APP.verification_status === "rejected") { A.innerHTML = '<div class="auth"><div class="card"><span class="pill bad">Suspended</span><h3 style="margin-top:8px">This shop is suspended</h3><p class="muted">Contact SafeBuy NG support if you think this is a mistake.</p><button class="btn line full" id="so2">Sign out</button></div></div>'; $("so2").onclick = signOut; return; }
    shell(); await Promise.all([loadOrders(), loadProducts(), loadAlerts()]); shell();
    clearInterval(timer); timer = setInterval(function () { refresh(false); }, 20000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(false); });
    try { if (chan) C.removeChannel(chan); chan = C.channel("sell-" + USER.id).on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications", filter: "user_id=eq." + USER.id }, function (p) { if (p.new && p.new.role === "seller") refresh(false); }).subscribe(); } catch (e) {}
    ["../seller-hub.js?v=12", "../instant.js?v=2", "../visual-search.js?v=1"].forEach(function (u) { var h = document.createElement("script"); h.src = u; h.async = true; document.body.appendChild(h); });
  }
  A.addEventListener("click", orderClick);
  window.__sbWhenReady(function () {
    C = window.safeBuySupabase;
    if (!C) { A.innerHTML = '<div class="auth"><div class="card"><h3>No connection</h3><p class="muted">We could not reach SafeBuy. Check your data and try again.</p><button class="btn full" onclick="location.reload()">Try again</button></div></div>'; return; }
    C.auth.onAuthStateChange(function (ev) { if (ev === "SIGNED_OUT") location.reload(); if (ev === "PASSWORD_RECOVERY") { var p = window.prompt("Enter a new password (8+ characters)"); if (p && p.length >= 8) C.auth.updateUser({ password: p }).then(function (r) { toast(r.error ? friendly(r.error) : "Password updated."); }); } });
    start();
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function () {});
})();
</script>
